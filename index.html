<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#070b18"
    >

    <title>التطور چات</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #070b18;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            color: #ffffff;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(128, 85, 246, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(34, 200, 233, 0.12),
                    transparent 30%
                ),
                #070b18;
        }

        button,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .hidden {
            display: none !important;
        }

        .app {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
   HEADER — iPhone Floating Style
===================================================== */

.topbar {
    position: absolute;

    top: 8px;
    left: 9px;
    right: 9px;

    width: auto;
    height: 64px;

    margin: 0;

    padding:
        8px
        12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        rgba(10, 15, 30, 0.58);

    border:
        1px solid
        rgba(140, 155, 200, 0.16);

    border-radius: 21px;

    backdrop-filter:
        blur(18px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(140%);

    box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.16);

    z-index: 20;
}


/* اسم الموقع */

.brand {
    display: flex;

    align-items: center;

    min-width: 0;

    direction: rtl;
}

.brand-info {
    min-width: 0;
}

.brand-info h1 {
    margin: 0;

    color: #ffffff;

    font-size: 21px;

    line-height: 1.2;

    font-weight: 750;

    white-space: nowrap;

    letter-spacing: -0.3px;
}


/* أزرار الهيدر */

.header-actions {
    display: flex;

    align-items: center;

    gap: 7px;

    direction: ltr;
}


/* زر عام */

.header-button {
    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius: 15px;

    color: #ffffff;

    background:
        rgba(255, 255, 255, 0.055);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.header-button:active {
    transform: scale(0.95);

    background:
        rgba(255, 255, 255, 0.10);
}


/* محادثة جديدة */

.new-chat-button {
    padding:
        0
        13px;

    font-size: 13px;

    white-space: nowrap;
}


/* زر القائمة */

.menu-button {
    width: 44px;

    padding: 0;

    font-size: 21px;

    font-weight: 500;
}


/* =====================================================
   تعديل مساحة المحادثة بسبب الهيدر العائم
===================================================== */

.chat-area {
    padding-top: 0;
}


/* =====================================================
   MOBILE HEADER
===================================================== */

@media (max-width: 700px) {

    .topbar {
    height: 64px;

    margin: 8px 9px 0;

    padding:
        8px
        12px;

    border-radius: 21px;

    background:
        rgba(10, 15, 30, 0.58);

    backdrop-filter:
        blur(18px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(140%);
}

    .brand-info h1 {
        font-size: 19px;
    }

    .header-actions {
        gap: 5px;
    }

    .new-chat-button {
        display: flex;

        height: 42px;

        padding:
            0
            11px;

        font-size: 12px;
    }

    .menu-button {
        width: 42px;
        height: 42px;

        font-size: 20px;
    }

    .chat-area {
        padding-top: 0;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .topbar {
        left: 8px;
        right: 8px;

        padding-left: 13px;
    }

    .brand-info h1 {
        font-size: 18px;
    }

    .new-chat-button {
        padding:
            0
            9px;

        font-size: 11px;
    }
}


        /* =====================================================
           CHAT
        ===================================================== */

        .chat-area {
    flex: 1;

    min-height: 0;

    width: 100%;

    position: relative;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

        .messages {
    flex: 1;

    width: 100%;

    max-width: 980px;

    margin: 0 auto;

    padding:
        92px
        20px
        145px;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-behavior: smooth;

    scrollbar-width: thin;

    scrollbar-color:
        rgba(120, 130, 170, 0.30)
        transparent;
}

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background:
                rgba(120, 130, 170, 0.30);

            border-radius: 20px;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                30px
                0
                80px;
        }

        .welcome-content {
            width: 100%;

            max-width: 620px;

            text-align: center;
        }

        /* =====================================================
           LOGO - WELCOME
        ===================================================== */

        .welcome-logo {
            width: 76px;
            height: 76px;

            margin:
                0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            overflow: hidden;

            background: #070b18;

            box-shadow:
                0 18px 50px
                rgba(65, 155, 235, 0.20);
        }

        .welcome-logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .welcome h2 {
            margin:
                0 0 10px;

            font-size: 30px;

            font-weight: 750;
        }

        .welcome p {
            margin: 0;

            color: #858da8;

            font-size: 16px;

            line-height: 1.8;
        }

        .suggestions {
            margin-top: 28px;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 10px;
        }

        .suggestion {
            min-height: 62px;

            padding:
                12px
                15px;

            text-align: right;

            color: #d8dced;

            background:
                rgba(15, 23, 46, 0.70);

            border:
                1px solid
                rgba(130, 145, 190, 0.13);

            border-radius: 17px;

            cursor: pointer;

            font-size: 14px;

            line-height: 1.5;
        }

        .suggestion:active {
            transform: scale(0.98);
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message-row {
            width: 100%;

            display: flex;

            margin-bottom: 15px;
        }

        .message-row.user {
            justify-content: flex-start;
        }

        .message-row.assistant {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width:
                min(
                    78%,
                    720px
                );

            padding:
                14px
                17px;

            border-radius: 20px;

            font-size: 16px;

            line-height: 1.8;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .message-row.user
        .message-bubble {
            background:
                linear-gradient(
                    135deg,
                    #7752ef,
                    #398fe4
                );

            border-bottom-right-radius: 7px;
        }

        .message-row.assistant
        .message-bubble {
            background:
                #11182d;

            border:
                1px solid
                rgba(130, 145, 190, 0.13);

            border-bottom-left-radius: 7px;
        }

        .message-bubble.loading {
            color: #8c96b0;
        }

        .message-bubble.error {
            color: #ff9eaa;

            border-color:
                rgba(255, 80, 105, 0.25);
        }


        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-wrap {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                15px
                20px
                calc(
                    15px +
                    env(safe-area-inset-bottom)
                );

            pointer-events: none;

            background:
                linear-gradient(
                    to top,
                    #070b18 45%,
                    rgba(7, 11, 24, 0.88) 75%,
                    transparent
                );
        }

        .composer {
            width: 100%;

            max-width: 980px;

            margin: 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 9px;

            padding: 9px;

            pointer-events: auto;

            background:
                rgba(14, 21, 42, 0.96);

            border:
                1px solid
                rgba(135, 150, 195, 0.20);

            border-radius: 23px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.28);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }

        .message-input {
            flex: 1;

            width: 100%;

            min-height: 50px;
            max-height: 140px;

            padding:
                13px
                12px;

            resize: none;

            border: 0;
            outline: 0;

            color: #ffffff;

            background: transparent;

            font-size: 16px;

            line-height: 1.55;
        }

        .message-input::placeholder {
            color: #707993;
        }

        .send-button {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            border-radius: 17px;

            color: #ffffff;

            font-size: 27px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );

            cursor: pointer;
        }

        .send-button:active {
            transform: scale(0.94);
        }

        .send-button:disabled {
            opacity: 0.45;

            cursor: wait;
        }


        /* =====================================================
           MENU
        ===================================================== */

        .menu-overlay {
            position: fixed;

            inset: 0;

            z-index: 90;

            background:
                rgba(0, 0, 0, 0.48);

            backdrop-filter:
                blur(3px);

            -webkit-backdrop-filter:
                blur(3px);
        }

        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            z-index: 100;

            width:
                min(
                    390px,
                    88vw
                );

            height: 100dvh;

            padding: 22px;

            background:
                #0b1124;

            border-left:
                1px solid
                rgba(130, 145, 190, 0.17);

            box-shadow:
                -25px 0 70px
                rgba(0, 0, 0, 0.40);

            transform:
                translateX(100%);

            transition:
                transform 0.25s ease;

            overflow-y: auto;
        }

        .side-menu.open {
            transform:
                translateX(0);
        }

        .menu-header {
            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .menu-header h2 {
            margin: 0;

            font-size: 26px;
        }

        .close-menu {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(130, 145, 190, 0.18);

            border-radius: 14px;

            background:
                rgba(16, 23, 46, 0.80);

            color: #ffffff;

            font-size: 27px;

            cursor: pointer;
        }

        .account-card {
            margin-top: 25px;

            display: flex;

            align-items: center;

            gap: 13px;

            padding: 15px;

            border:
                1px solid
                rgba(130, 145, 190, 0.15);

            border-radius: 19px;

            background:
                #11182d;
        }

        .account-avatar {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            font-size: 21px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );
        }

        .account-info {
            min-width: 0;
        }

        .account-info small {
            display: block;

            margin-bottom: 3px;

            color: #737d98;

            font-size: 12px;
        }

        .account-info strong {
            display: block;

            max-width: 240px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 15px;
        }


        /* =====================================================
           CONVERSATIONS
        ===================================================== */

        .conversation-section {
            margin-top: 25px;
        }

        .conversation-title {
            margin-bottom: 10px;

            color: #8993ad;

            font-size: 13px;

            font-weight: 600;
        }

        .conversation-list {
            display: flex;

            flex-direction: column;

            gap: 7px;

            max-height: 43vh;

            overflow-y: auto;

            padding-left: 2px;
        }

        .conversation-item {
            width: 100%;

            min-height: 49px;

            padding:
                9px
                11px;

            display: flex;

            align-items: center;

            text-align: right;

            border:
                1px solid
                transparent;

            border-radius: 14px;

            background:
                rgba(16, 23, 46, 0.55);

            color: #d8dced;

            cursor: pointer;

            font-size: 14px;

            line-height: 1.45;
        }

        .conversation-item.active {
            background:
                rgba(128, 85, 246, 0.13);

            border-color:
                rgba(128, 85, 246, 0.30);

            color: #ffffff;
        }

        .conversation-item-text {
            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;

            overflow-wrap: anywhere;
        }

        .empty-conversations {
            padding: 15px 10px;

            text-align: center;

            color: #606a84;

            font-size: 13px;

            line-height: 1.6;
        }

        .side-action {
            width: 100%;

            height: 56px;

            margin-top: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 17px;

            font-size: 15px;

            cursor: pointer;
        }

        .new-side-chat {
            color: #ffffff;

            border:
                1px solid
                rgba(128, 85, 246, 0.48);

            background:
                rgba(128, 85, 246, 0.08);
        }

        .logout-button {
            color: #ffffff;

            border: 0;

            background:
                linear-gradient(
                    100deg,
                    #8055f6,
                    #22c8e9
                );
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 105px;

            z-index: 200;

            transform:
                translateX(-50%)
                translateY(20px);

            min-width: 220px;

            max-width: 90vw;

            padding:
                12px
                17px;

            text-align: center;

            border:
                1px solid
                rgba(130, 145, 190, 0.18);

            border-radius: 14px;

            color: #ffffff;

            background:
                rgba(15, 22, 43, 0.96);

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.30);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .topbar {
                height: 70px;

                padding:
                    10px
                    13px;
            }

            .brand {
                gap: 9px;
            }

            .brand-logo {
                width: 44px;
                height: 44px;

                flex-basis: 44px;

                border-radius: 14px;
            }

            .brand-info h1 {
                font-size: 20px;
            }

            .online-status {
                font-size: 11px;
            }

            .header-actions {
                gap: 6px;
            }

            .new-chat-button {
                display: none;
            }

            .menu-button {
                width: 43px;
                height: 43px;
            }

            .messages {
                padding:
                    18px
                    12px
                    135px;
            }

            .welcome {
                padding:
                    15px
                    0
                    80px;
            }

            .welcome-logo {
                width: 66px;
                height: 66px;

                border-radius: 21px;
            }

            .welcome h2 {
                font-size: 25px;
            }

            .welcome p {
                font-size: 14px;
            }

            .suggestions {
                grid-template-columns: 1fr;

                margin-top: 22px;
            }

            .suggestion {
                min-height: 54px;
            }

            .message-bubble {
                max-width: 88%;

                font-size: 15px;

                padding:
                    12px
                    14px;
            }

            .composer-wrap {
                padding:
                    9px
                    10px
                    calc(
                        9px +
                        env(safe-area-inset-bottom)
                    );
            }

            .composer {
                border-radius: 20px;
            }

            .message-input {
                font-size: 15px;

                min-height: 47px;
            }

            .send-button {
                width: 49px;
                height: 49px;

                flex-basis: 49px;

                border-radius: 15px;

                font-size: 25px;
            }

            .side-menu {
                width: 90vw;
            }
        }

        @media (max-width: 380px) {

            .brand-info h1 {
                font-size: 18px;
            }

            .brand-logo {
                width: 41px;
                height: 41px;

                flex-basis: 41px;
            }

            .message-bubble {
                max-width: 92%;
            }
        }

    </style>

</head>


<body>

<div class="app">

    <header class="topbar">

    <!-- اسم الموقع -->
    <div class="brand">

        <div class="brand-info">

            <h1>
                التطور چات
            </h1>

        </div>

    </div>


    <!-- أزرار الهيدر -->
    <div class="header-actions">

        <button
            id="newChatButton"
            class="header-button new-chat-button"
            type="button"
        >
            + محادثة جديدة
        </button>

        <button
            id="menuButton"
            class="header-button menu-button"
            type="button"
            aria-label="فتح القائمة"
        >
            ☰
        </button>

    </div>

</header>


    <main class="chat-area">

        <section
            id="messages"
            class="messages"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-content">

                    <div class="welcome-logo">
                        <img
                            src="/assets/altatawur-robot-logo.jpeg"
                            alt="التطور چات"
                        >
                    </div>

                    <h2>
                        شلون أگدر أساعدك؟
                    </h2>

                    <p>
                        اسألني عن أي موضوع، وأنا أساعدك بالمعلومات والأفكار والحلول.
                    </p>

                    <div class="suggestions">

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="اكتبلي فكرة مشروع صغيرة ومربحة"
                        >
                            💡 اقترحلي فكرة مشروع
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="ساعدني أكتب إعلان احترافي وجذاب"
                        >
                            ✍️ اكتبلي إعلان
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="اشرحلي الذكاء الاصطناعي بطريقة بسيطة"
                        >
                            🤖 اشرحلي الذكاء الاصطناعي
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="ساعدني أخطط لشيء أريد أسويه"
                        >
                            📋 ساعدني بالتخطيط
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <div class="composer-wrap">

            <div class="composer">

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="اكتب سؤالك هنا..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    aria-label="إرسال"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<div
    id="menuOverlay"
    class="menu-overlay hidden"
></div>


<aside
    id="sideMenu"
    class="side-menu"
    aria-hidden="true"
>

    <div class="menu-header">

        <h2>
            القائمة
        </h2>

        <button
            id="closeMenu"
            class="close-menu"
            type="button"
            aria-label="إغلاق"
        >
            ×
        </button>

    </div>


    <div class="account-card">

        <div
            id="accountAvatar"
            class="account-avatar"
        >
            أ
        </div>

        <div class="account-info">

            <small>
                الحساب
            </small>

            <strong id="usernameDisplay">
                جاري التحميل...
            </strong>

        </div>

    </div>


    <section class="conversation-section">

        <div class="conversation-title">
            المحادثات
        </div>

        <div
            id="conversationList"
            class="conversation-list"
        >

            <div class="empty-conversations">
                جاري تحميل المحادثات...
            </div>

        </div>

    </section>


    <button
        id="newChatSide"
        class="side-action new-side-chat"
        type="button"
    >
        + محادثة جديدة
    </button>


    <button
        id="logoutButton"
        class="side-action logout-button"
        type="button"
    >
        تسجيل الخروج
    </button>

</aside>


<div
    id="toast"
    class="toast"
></div>


<script>

"use strict";


// =========================================================
// SUPABASE
// =========================================================

const SUPABASE_URL =
    "https://wxsricscchalzvazdbzd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_5oPDD77Veu5OczxaZje7vg_orfNjB5t";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


// =========================================================
// ELEMENTS
// =========================================================

const messages =
    document.getElementById("messages");

const welcome =
    document.getElementById("welcome");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const newChatSide =
    document.getElementById("newChatSide");

const menuButton =
    document.getElementById("menuButton");

const closeMenu =
    document.getElementById("closeMenu");

const sideMenu =
    document.getElementById("sideMenu");

const menuOverlay =
    document.getElementById("menuOverlay");

const logoutButton =
    document.getElementById("logoutButton");

const usernameDisplay =
    document.getElementById("usernameDisplay");

const accountAvatar =
    document.getElementById("accountAvatar");

const conversationList =
    document.getElementById("conversationList");

const toast =
    document.getElementById("toast");


// =========================================================
// STATE
// =========================================================

let currentUser = null;

let currentConversationId = null;

let conversation = [];

let isSending = false;

let toastTimer = null;


// =========================================================
// STORAGE KEY
// =========================================================

const CURRENT_CONVERSATION_KEY =
    "altatawur_current_conversation";


// =========================================================
// TOAST
// =========================================================

function showToast(text) {

    if (!toast) {
        return;
    }

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove("show");

            },
            3500
        );
}


// =========================================================
// MENU
// =========================================================

function openMenu() {

    sideMenu.classList.add("open");

    menuOverlay.classList.remove("hidden");

    sideMenu.setAttribute(
        "aria-hidden",
        "false"
    );
}


function closeMenuPanel() {

    sideMenu.classList.remove("open");

    menuOverlay.classList.add("hidden");

    sideMenu.setAttribute(
        "aria-hidden",
        "true"
    );
}


menuButton.addEventListener(
    "click",
    openMenu
);

closeMenu.addEventListener(
    "click",
    closeMenuPanel
);

menuOverlay.addEventListener(
    "click",
    closeMenuPanel
);


// =========================================================
// RESET CHAT UI
// =========================================================

function resetChatUI() {

    messages.innerHTML = "";

    messages.appendChild(
        welcome
    );

    welcome.classList.remove(
        "hidden"
    );

    messageInput.value = "";

    messageInput.style.height =
        "auto";

    scrollToBottom();
}


// =========================================================
// NEW CHAT
// =========================================================

function startNewChat() {

    if (isSending) {
        return;
    }

    currentConversationId = null;

    conversation = [];

    localStorage.removeItem(
        CURRENT_CONVERSATION_KEY
    );

    resetChatUI();

    renderConversationList();

    closeMenuPanel();

    messageInput.focus();

    showToast(
        "تم فتح محادثة جديدة."
    );
}


newChatButton.addEventListener(
    "click",
    startNewChat
);

newChatSide.addEventListener(
    "click",
    startNewChat
);


// =========================================================
// ADD MESSAGE
// =========================================================

function addMessage(
    text,
    role
) {

    welcome.classList.add(
        "hidden"
    );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        `message-row ${role}`;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );

    messages.appendChild(
        row
    );

    scrollToBottom();

    return row;
}


// =========================================================
// LOADING
// =========================================================

function showLoading() {

    welcome.classList.add(
        "hidden"
    );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row assistant";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble loading";

    bubble.textContent =
        "جاري التفكير...";


    row.appendChild(
        bubble
    );

    messages.appendChild(
        row
    );

    scrollToBottom();

    return row;
}


// =========================================================
// SCROLL
// =========================================================

function scrollToBottom() {

    requestAnimationFrame(
        () => {

            messages.scrollTop =
                messages.scrollHeight;

        }
    );
}


// =========================================================
// RESIZE INPUT
// =========================================================

function resizeInput() {

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            140
        ) + "px";
}


messageInput.addEventListener(
    "input",
    resizeInput
);


// =========================================================
// SESSION
// =========================================================

async function getValidSession() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "GET SESSION ERROR:",
            error
        );

        throw new Error(
            "تعذر التحقق من جلسة تسجيل الدخول."
        );
    }


    if (!data?.session) {

        throw new Error(
            "انتهت جلسة تسجيل الدخول."
        );
    }


    return data.session;
}


// =========================================================
// USER PROFILE
// =========================================================

async function loadUserProfile() {

    if (!currentUser) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "username,email"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if (error) {

            console.error(
                "PROFILE ERROR:",
                error
            );

        }


        const username =
            data?.username ||
            currentUser.user_metadata?.username ||
            data?.email ||
            currentUser.email ||
            "مستخدم";


        usernameDisplay.textContent =
            username;


        accountAvatar.textContent =
            username
                .trim()
                .charAt(0)
                .toUpperCase() ||
            "أ";


    } catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );


        const username =
            currentUser.user_metadata?.username ||
            currentUser.email ||
            "مستخدم";


        usernameDisplay.textContent =
            username;


        accountAvatar.textContent =
            username
                .trim()
                .charAt(0)
                .toUpperCase() ||
            "أ";
    }
}


// =========================================================
// LOAD CONVERSATIONS
// =========================================================

async function loadConversationList() {

    if (!currentUser) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("conversations")
                .select(
                    "id,title,created_at,updated_at"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "LOAD CONVERSATIONS ERROR:",
                error
            );


            conversationList.innerHTML = `
                <div class="empty-conversations">
                    تعذر تحميل المحادثات.
                </div>
            `;

            return;
        }


        renderConversationList(
            data || []
        );


    } catch (error) {

        console.error(
            "CONVERSATION LIST ERROR:",
            error
        );

    }
}


// =========================================================
// RENDER CONVERSATION LIST
// =========================================================

function renderConversationList(
    conversations = null
) {

    if (!conversationList) {
        return;
    }


    if (conversations === null) {

        document
            .querySelectorAll(
                ".conversation-item"
            )
            .forEach(
                item => {

                    item.classList.toggle(
                        "active",
                        item.dataset.id ===
                            String(
                                currentConversationId
                            )
                    );

                }
            );

        return;
    }


    conversationList.innerHTML = "";


    if (!conversations.length) {

        conversationList.innerHTML = `
            <div class="empty-conversations">
                لا توجد محادثات محفوظة بعد.
            </div>
        `;

        return;
    }


    conversations.forEach(
        (item) => {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "conversation-item";

            button.dataset.id =
                String(item.id);


            if (
                String(item.id) ===
                String(currentConversationId)
            ) {

                button.classList.add(
                    "active"
                );
            }


            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "conversation-item-text";

            text.textContent =
                item.title ||
                "محادثة جديدة";


            button.appendChild(
                text
            );


            button.addEventListener(
                "click",
                async () => {

                    await openConversation(
                        item.id
                    );

                    closeMenuPanel();

                }
            );


            conversationList.appendChild(
                button
            );

        }
    );
}


// =========================================================
// LOAD LAST CONVERSATION
// =========================================================

async function loadLastConversation() {

    if (!currentUser) {
        return;
    }


    try {

        const savedId =
            localStorage.getItem(
                CURRENT_CONVERSATION_KEY
            );


        if (savedId) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("conversations")
                    .select(
                        "id,user_id,title,created_at,updated_at"
                    )
                    .eq(
                        "id",
                        savedId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();


            if (
                !error &&
                data
            ) {

                await openConversation(
                    data.id
                );

                return;
            }


            localStorage.removeItem(
                CURRENT_CONVERSATION_KEY
            );
        }


        const {
            data:
                latestConversations,

            error:
                latestError

        } =
            await supabaseClient
                .from("conversations")
                .select(
                    "id,user_id,title,created_at,updated_at"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(1);


        if (latestError) {

            console.error(
                "LATEST CONVERSATION ERROR:",
                latestError
            );

            resetChatUI();

            return;
        }


        if (
            latestConversations &&
            latestConversations.length
        ) {

            await openConversation(
                latestConversations[0].id
            );

            return;
        }


        currentConversationId =
            null;

        conversation = [];

        resetChatUI();


    } catch (error) {

        console.error(
            "LOAD LAST CONVERSATION ERROR:",
            error
        );

        resetChatUI();
    }
}


// =========================================================
// OPEN CONVERSATION
// =========================================================

async function openConversation(
    conversationId
) {

    if (
        !conversationId ||
        !currentUser
    ) {
        return;
    }


    try {

        const {
            data:
                conversationData,

            error:
                conversationError

        } =
            await supabaseClient
                .from("conversations")
                .select(
                    "id,user_id,title,created_at,updated_at"
                )
                .eq(
                    "id",
                    conversationId
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (
            conversationError ||
            !conversationData
        ) {

            console.error(
                "OPEN CONVERSATION ERROR:",
                conversationError
            );

            return;
        }


        currentConversationId =
            conversationData.id;


        localStorage.setItem(
            CURRENT_CONVERSATION_KEY,
            String(
                currentConversationId
            )
        );


        const {
            data,
            error
        } =
            await supabaseClient
                .from("messages")
                .select(
                    "id,conversation_id,role,content,created_at"
                )
                .eq(
                    "conversation_id",
                    conversationData.id
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "LOAD MESSAGES ERROR:",
                error
            );

            showToast(
                "تعذر تحميل رسائل المحادثة."
            );

            return;
        }


        conversation = [];

        resetChatUI();


        for (
            const message
            of data || []
        ) {

            if (
                message.role !== "user" &&
                message.role !== "assistant"
            ) {
                continue;
            }


            conversation.push({

                role:
                    message.role,

                content:
                    message.content

            });


            addMessage(
                message.content,
                message.role
            );
        }


        renderConversationList();

        scrollToBottom();


    } catch (error) {

        console.error(
            "OPEN CONVERSATION ERROR:",
            error
        );
    }
}


// =========================================================
// SEND MESSAGE
// =========================================================

async function sendMessage() {

    if (isSending) {
        return;
    }


    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    if (!currentUser) {

        showToast(
            "يجب تسجيل الدخول أولاً."
        );

        return;
    }


    isSending = true;

    sendButton.disabled = true;


    let loading = null;


    try {

        addMessage(
            text,
            "user"
        );


        conversation.push({

            role:
                "user",

            content:
                text

        });


        messageInput.value = "";

        messageInput.style.height =
            "auto";


        loading =
            showLoading();


        const session =
            await getValidSession();


        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${session.access_token}`

                    },

                    body:
                        JSON.stringify({

                            conversation_id:
                                currentConversationId,

                            message:
                                text

                        })

                }
            );


        let result = {};


        try {

            result =
                await response.json();

        } catch {

            result = {};
        }


        if (!response.ok) {

            throw new Error(
                result?.error ||
                "حدث خطأ في الخادم."
            );
        }


        if (loading) {

            loading.remove();

            loading = null;
        }


        if (
            result?.conversation_id
        ) {

            currentConversationId =
                result.conversation_id;


            localStorage.setItem(
                CURRENT_CONVERSATION_KEY,
                String(
                    currentConversationId
                )
            );
        }


        const answer =
            result?.message ||
            result?.answer ||
            result?.content ||
            "لم يصل رد من المساعد.";


        addMessage(
            answer,
            "assistant"
        );


        conversation.push({

            role:
                "assistant",

            content:
                answer

        });


        await loadConversationList();


    } catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        if (loading) {
            loading.remove();
        }


        const row =
            addMessage(
                error?.message ||
                "حدث خطأ. حاول مرة أخرى.",
                "assistant"
            );


        const bubble =
            row.querySelector(
                ".message-bubble"
            );


        if (bubble) {

            bubble.classList.add(
                "error"
            );
        }


        /*
         * إذا فشلت العملية قبل إنشاء المحادثة،
         * نحذف الرسالة من السياق المحلي.
         */

        if (
            !currentConversationId &&
            conversation.length &&
            conversation[
                conversation.length - 1
            ]?.role === "user"
        ) {

            conversation.pop();
        }


    } finally {

        isSending = false;

        sendButton.disabled = false;

        messageInput.focus();
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


// =========================================================
// ENTER
// =========================================================

messageInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


// =========================================================
// SUGGESTIONS
// =========================================================

document
    .querySelectorAll(
        ".suggestion"
    )
    .forEach(
        (button) => {

            button.addEventListener(
                "click",
                () => {

                    messageInput.value =
                        button.dataset.prompt ||
                        "";

                    resizeInput();

                    messageInput.focus();
                }
            );
        }
    );


// =========================================================
// LOGOUT
// =========================================================

async function logout() {

    logoutButton.disabled = true;

    logoutButton.textContent =
        "جاري تسجيل الخروج...";


    try {

        const {
            error
        } =
            await supabaseClient.auth.signOut();


        if (error) {
            throw error;
        }


        localStorage.removeItem(
            CURRENT_CONVERSATION_KEY
        );


        window.location.replace(
            "/login.html"
        );


    } catch (error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );


        logoutButton.disabled = false;

        logoutButton.textContent =
            "تسجيل الخروج";


        showToast(
            "تعذر تسجيل الخروج. حاول مرة أخرى."
        );
    }
}


logoutButton.addEventListener(
    "click",
    logout
);


// =========================================================
// AUTH STATE
// =========================================================

supabaseClient.auth.onAuthStateChange(
    (
        event,
        session
    ) => {

        console.log(
            "AUTH EVENT:",
            event
        );


        if (
            event === "SIGNED_OUT" ||
            (
                event === "TOKEN_REFRESHED" &&
                !session
            )
        ) {

            localStorage.removeItem(
                CURRENT_CONVERSATION_KEY
            );


            window.location.replace(
                "/login.html"
            );
        }
    }
);


// =========================================================
// INITIALIZE
// =========================================================

async function initialize() {

    try {

        console.log(
            "INITIALIZING ALTATAWUR CHAT..."
        );


        const session =
            await getValidSession();


        currentUser =
            session.user;


        console.log(
            "CURRENT USER:",
            currentUser.id
        );


        await loadUserProfile();

        await loadConversationList();

        await loadLastConversation();

        await loadConversationList();

        messageInput.focus();


    } catch (error) {

        console.error(
            "INITIALIZE ERROR:",
            error
        );


        window.location.replace(
            "/login.html"
        );
    }
}


initialize();

</script>

</body>

</html>
