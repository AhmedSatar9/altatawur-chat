<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>التطور چات</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            ت
        </div>

        <div>

            <h1>
                التطور چات
            </h1>

            <div class="online-status">

                <span></span>

                متصل الآن

            </div>

        </div>

    </div>


    <div class="header-actions">

        <button
            id="newChatButton"
            class="secondary-button"
        >
            + محادثة جديدة
        </button>

        <button
            id="menuButton"
            class="menu-button"
        >
            ☰
        </button>

    </div>

</header>


<main class="chat-container">

    <section
        id="messages"
        class="messages"
    >

    </section>


    <div class="composer">

        <textarea
            id="messageInput"
            placeholder="اكتب سؤالك هنا..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            class="send-button"
            type="button"
        >
            ↑
        </button>

    </div>

</main>


<!-- SIDE MENU -->

<div
    id="sideMenu"
    class="side-menu hidden"
>

    <button
        id="closeMenu"
        class="close-menu"
    >
        ×
    </button>


    <h2>
        محادثاتي
    </h2>


    <div class="account-card">

        <div class="account-avatar">
            أ
        </div>

        <div>

            <small>
                الحساب
            </small>

            <strong id="usernameDisplay">
                مستخدم
            </strong>

        </div>

    </div>


    <button
        id="newChatSide"
        class="menu-action"
    >
        + محادثة جديدة
    </button>


    <button
        id="logoutButton"
        class="logout-button"
    >
        تسجيل الخروج
    </button>

</div>


<script src="app.js"></script>

</body>

</html>
