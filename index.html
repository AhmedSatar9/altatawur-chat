<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>التطور چات</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            ت
        </div>

        <div>

            <h1>
                التطور چات
            </h1>

            <div class="online-status">
                <span></span>
                متصل الآن
            </div>

        </div>

    </div>


    <div class="header-actions">

        <button
            id="newChatButton"
            class="secondary-button"
            type="button"
        >
            + محادثة جديدة
        </button>

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="فتح القائمة"
        >
            ☰
        </button>

    </div>

</header>


<main class="chat-container">

    <section
        id="messages"
        class="messages"
    >

        <div
            id="welcomeMessage"
            class="welcome-message"
        >

            <div class="welcome-logo">
                ت
            </div>

            <h2>
                أهلاً بك في التطور چات
            </h2>

            <p>
                اكتب سؤالك وابدأ محادثتك مع المساعد الذكي.
            </p>

        </div>

    </section>


    <div class="composer">

        <textarea
            id="messageInput"
            placeholder="اكتب سؤالك هنا..."
            rows="1"
            autocomplete="off"
        ></textarea>


        <button
            id="sendButton"
            class="send-button"
            type="button"
            aria-label="إرسال"
        >
            ↑
        </button>

    </div>

</main>


<!-- ==============================
     SIDE MENU
============================== -->

<div
    id="menuOverlay"
    class="menu-overlay hidden"
></div>


<aside
    id="sideMenu"
    class="side-menu hidden"
>

    <div class="side-menu-header">

        <h2>
            القائمة
        </h2>

        <button
            id="closeMenu"
            class="close-menu"
            type="button"
            aria-label="إغلاق"
        >
            ×
        </button>

    </div>


    <div class="account-card">

        <div class="account-avatar">
            أ
        </div>

        <div class="account-info">

            <small>
                الحساب
            </small>

            <strong id="usernameDisplay">
                مستخدم
            </strong>

        </div>

    </div>


    <button
        id="newChatSide"
        class="menu-action"
        type="button"
    >
        <span>＋</span>
        محادثة جديدة
    </button>


    <button
        id="logoutButton"
        class="logout-button"
        type="button"
    >
        تسجيل الخروج
    </button>

</aside>


<script src="app.js"></script>

</body>

</html>
