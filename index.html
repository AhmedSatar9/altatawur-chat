<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التطور چات</title>

  <style>
    :root {
      --bg: #070912;
      --panel: #0d1222;
      --panel2: #11182a;
      --border: rgba(255,255,255,.09);
      --text: #f5f7ff;
      --muted: #8d96aa;
      --purple: #8b5cf6;
      --cyan: #22d3ee;
      --gradient: linear-gradient(135deg, #8b5cf6, #22d3ee);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      height: 92px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,18,34,.94);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(100,90,255,.18);
    }

    .brand-info h1 {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .status {
      color: #6ee7b7;
      font-size: 14px;
    }

    /* =========================
       HEADER ACTIONS
    ========================== */

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      direction: ltr;
    }

    .new-chat {
      height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: .2s ease;
    }

    .new-chat:hover {
      color: white;
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
    }

    .menu {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 14px;
      color: white;
      font-size: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       CHAT
    ========================== */

    .chat {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 35px 20px 180px;
    }

    /* =========================
       WELCOME
    ========================== */

    .welcome {
      text-align: center;
      padding: 70px 10px 30px;
    }

    .welcome-logo {
      width: 110px;
      height: 110px;
      border-radius: 32px;
      background: var(--gradient);
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      font-weight: 800;
      box-shadow: 0 20px 60px rgba(100,90,255,.18);
    }

    .welcome h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .welcome h2 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      max-width: 650px;
      margin: auto;
    }

    /* =========================
       MESSAGES
    ========================== */

    .message {
      display: flex;
      gap: 12px;
      margin: 25px 0;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .message.assistant .avatar {
      background: #182137;
    }

    .bubble {
      max-width: 75%;
      padding: 15px 19px;
      border-radius: 20px;
      background: var(--panel2);
      border: 1px solid var(--border);
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: #111a30;
    }

    /* صورة داخل الرسالة */

    .message-image {
      display: block;
      width: 100%;
      max-width: 360px;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .message-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #dbe1ef;
      font-size: 14px;
    }

    /* =========================
       ATTACHMENT PREVIEW
    ========================== */

    .attachment-preview {
      display: none;
      max-width: 900px;
      margin: 0 auto 10px;
      padding: 10px;
      background: rgba(13,18,34,.96);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 17px;
    }

    .attachment-preview.active {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attachment-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(139,92,246,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .attachment-info {
      min-width: 0;
      flex: 1;
    }

    .attachment-name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attachment-size {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .remove-attachment {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #8d96aa;
      font-size: 20px;
      cursor: pointer;
    }

    .remove-attachment:hover {
      color: #ff6b81;
      background: rgba(255,107,129,.08);
    }

    /* =========================
       IMAGE PREVIEW
    ========================== */

    .attachment-image {
      width: 52px;
      height: 52px;
      border-radius: 11px;
      object-fit: cover;
      display: none;
      flex-shrink: 0;
    }

    /* =========================
       TYPING
    ========================== */

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8b5cf6;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-6px);
      }
    }

    /* =========================
       INPUT AREA
    ========================== */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 20px 25px;
      background:
        linear-gradient(
          transparent,
          rgba(7,9,18,.96) 35%
        );
      z-index: 200;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 25px;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 -5px 30px rgba(0,0,0,.15);
    }

    /* =========================
       ATTACH BUTTON
    ========================== */

    .attach-button {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: #aab2c5;
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s ease;
    }

    .attach-button:hover {
      color: white;
      background: rgba(255,255,255,.06);
    }

    .attach-button:active {
      transform: scale(.94);
    }

    #fileInput {
      display: none;
    }

    /* =========================
       TEXTAREA
    ========================== */

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      line-height: 1.6;
      min-height: 52px;
      max-height: 150px;
      padding: 13px 12px;
    }

    textarea::placeholder {
      color: #69738b;
    }

    /* =========================
       SEND
    ========================== */

    .send {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 17px;
      background: var(--gradient);
      color: white;
      font-size: 26px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s ease;
    }

    .send:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(139,92,246,.25);
    }

    .send:active:not(:disabled) {
      transform: scale(.94);
    }

    .send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       SIDE MENU
    ========================== */

    .side-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: .25s ease;
    }

    .side-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 330px;
      max-width: 88vw;
      background: #0b1020;
      border-left: 1px solid var(--border);
      z-index: 301;
      transform: translateX(100%);
      transition: .28s ease;
      display: flex;
      flex-direction: column;
    }

    .side-panel.active {
      transform: translateX(0);
    }

    .side-header {
      height: 82px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-header h3 {
      font-size: 20px;
    }

    .close-menu {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .side-new {
      margin: 16px;
      padding: 14px;
      border: 1px solid rgba(139,92,246,.35);
      border-radius: 15px;
      background: rgba(139,92,246,.08);
      color: white;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
    }

    .conversation-empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      line-height: 1.8;
      font-size: 14px;
    }

    .conversation-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: white;
      border-radius: 14px;
      padding: 13px 12px;
      margin-bottom: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
      transition: .2s ease;
    }

    .conversation-item:hover {
      background: rgba(255,255,255,.04);
      border-color: var(--border);
    }

    .conversation-item.active {
      background: rgba(139,92,246,.10);
      border-color: rgba(139,92,246,.25);
    }

    .conversation-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .delete-conversation {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #788198;
      cursor: pointer;
      font-size: 16px;
    }

    .delete-conversation:hover {
      color: #ff6b81;
      background: rgba(255,107,129,.08);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      header {
        height: 82px;
        padding: 12px 16px;
      }

      .brand {
        gap: 10px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        font-size: 27px;
      }

      .brand-info h1 {
        font-size: 21px;
      }

      .status {
        font-size: 13px;
      }

      .header-actions {
        gap: 7px;
      }

      .new-chat {
        height: 44px;
        padding: 0 11px;
        font-size: 12px;
        border-radius: 13px;
      }

      .menu {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        font-size: 23px;
      }

      .chat {
        padding: 20px 12px 175px;
      }

      .welcome {
        padding-top: 60px;
      }

      .welcome-logo {
        width: 90px;
        height: 90px;
        font-size: 45px;
        border-radius: 28px;
      }

      .welcome h2 {
        font-size: 29px;
      }

      .welcome p {
        font-size: 15px;
      }

      .bubble {
        max-width: 82%;
        font-size: 15px;
      }

      .avatar {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }

      .input-area {
        padding: 14px 14px 22px;
      }

      .input-box {
        border-radius: 23px;
      }

      .attach-button {
        width: 45px;
        height: 52px;
        font-size: 22px;
      }

      .side-panel {
        width: 310px;
      }

      .message-image {
        max-width: 260px;
      }
    }

    @media (max-width: 380px) {

      .new-chat {
        padding: 0 8px;
        font-size: 11px;
      }

      .brand-info h1 {
        font-size: 18px;
      }

      .status {
        font-size: 12px;
      }

      .logo {
        width: 46px;
        height: 46px;
      }

      .menu {
        width: 42px;
        height: 42px;
      }

      .attach-button {
        width: 40px;
      }

      .send {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>

    <div class="brand">

      <div class="logo">
        ت
      </div>

      <div class="brand-info">

        <h1>
          التطور چات
        </h1>

        <div class="status">
          ● متصل الآن
        </div>

      </div>

    </div>

    <div class="header-actions">

      <button
        class="new-chat"
        onclick="newChat()"
      >
        + محادثة جديدة
      </button>

      <button
        class="menu"
        onclick="toggleMenu()"
        aria-label="القائمة"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  ></main>


  <!-- INPUT -->

  <div class="input-area">

    <!-- ATTACHMENT PREVIEW -->

    <div
      class="attachment-preview"
      id="attachmentPreview"
    >

      <img
        class="attachment-image"
        id="attachmentImage"
        alt=""
      >

      <div
        class="attachment-icon"
        id="attachmentIcon"
      >
        📎
      </div>

      <div class="attachment-info">

        <div
          class="attachment-name"
          id="attachmentName"
        ></div>

        <div
          class="attachment-size"
          id="attachmentSize"
        ></div>

      </div>

      <button
        class="remove-attachment"
        onclick="removeAttachment()"
        aria-label="إزالة المرفق"
      >
        ×
      </button>

    </div>


    <div class="input-box">

      <!-- FILE INPUT -->

      <input
        type="file"
        id="fileInput"
        accept="image/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.csv"
      >


      <!-- ATTACH BUTTON -->

      <button
        type="button"
        class="attach-button"
        id="attachButton"
        aria-label="إضافة مرفق"
        title="إضافة مرفق"
      >
        📎
      </button>


      <!-- TEXT -->

      <textarea
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        rows="1"
      ></textarea>


      <!-- SEND -->

      <button
        type="button"
        class="send"
        id="sendButton"
        aria-label="إرسال"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<!-- SIDE MENU -->

<div
  class="side-overlay"
  id="sideOverlay"
></div>


<aside
  class="side-panel"
  id="sidePanel"
>

  <div class="side-header">

    <h3>
      محادثاتي
    </h3>

    <button
      class="close-menu"
      id="closeMenu"
    >
      ×
    </button>

  </div>


  <button
    class="side-new"
    id="sideNewChat"
  >
    ＋ محادثة جديدة
  </button>


  <div
    class="conversation-list"
    id="conversationList"
  ></div>

</aside>


<script>

  /* =========================
     ELEMENTS
  ========================== */

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const attachButton =
    document.getElementById("attachButton");

  const fileInput =
    document.getElementById("fileInput");

  const attachmentPreview =
    document.getElementById("attachmentPreview");

  const attachmentName =
    document.getElementById("attachmentName");

  const attachmentSize =
    document.getElementById("attachmentSize");

  const attachmentImage =
    document.getElementById("attachmentImage");

  const attachmentIcon =
    document.getElementById("attachmentIcon");

  const sidePanel =
    document.getElementById("sidePanel");

  const sideOverlay =
    document.getElementById("sideOverlay");

  const closeMenuButton =
    document.getElementById("closeMenu");

  const sideNewChat =
    document.getElementById("sideNewChat");

  const conversationList =
    document.getElementById("conversationList");


  /* =========================
     STORAGE
  ========================== */

  const STORAGE_KEY =
    "altatawur_conversations";

  const ACTIVE_KEY =
    "altatawur_active_conversation";


  let conversations = [];

  try {

    conversations =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

    if (!Array.isArray(conversations)) {
      conversations = [];
    }

  } catch (error) {

    conversations = [];

  }


  let activeConversationId =
    localStorage.getItem(ACTIVE_KEY) || null;


  /* =========================
     CURRENT ATTACHMENT
  ========================== */

  let selectedFile = null;

  let selectedFileData = null;

  let isSending = false;


  /* =========================
     SAVE
  ========================== */

  function saveConversations() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversations)
      );

    } catch (error) {

      console.error(
        "Storage Error:",
        error
      );

    }

  }


  function saveActiveId() {

    if (activeConversationId) {

      localStorage.setItem(
        ACTIVE_KEY,
        activeConversationId
      );

    } else {

      localStorage.removeItem(
        ACTIVE_KEY
      );

    }

  }


  /* =========================
     CREATE ID
  ========================== */

  function createId() {

    return (
      Date.now().toString() +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  /* =========================
     CURRENT CONVERSATION
  ========================== */

  function getActiveConversation() {

    return conversations.find(
      conversation =>
        conversation.id ===
        activeConversationId
    );

  }


  /* =========================
     WELCOME
  ========================== */

  function showWelcome() {

    chat.innerHTML = `

      <section class="welcome">

        <div class="welcome-logo">
          ت
        </div>

        <h2>
          أهلاً بك في
          <span>
            التطور چات
          </span>
        </h2>

        <p>
          مساعدك الذكي للإجابة عن الأسئلة،
          شرح المواضيع، كتابة النصوص
          وتوليد الأفكار.
        </p>

      </section>

    `;

  }


  /* =========================
     ADD MESSAGE
  ========================== */

  function addMessage(
    role,
    text,
    attachment = null
  ) {

    const message =
      document.createElement("div");

    message.className =
      `message ${role}`;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      role === "user"
        ? "أ"
        : "ت";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    /*
      صورة مرفقة
    */

    if (
      attachment &&
      attachment.type === "image" &&
      attachment.data
    ) {

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src =
        attachment.data;

      img.alt =
        attachment.name || "صورة";

      bubble.appendChild(img);

    }


    /*
      ملف مرفق غير صورة
    */

    if (
      attachment &&
      attachment.type !== "image"
    ) {

      const fileBox =
        document.createElement("div");

      fileBox.className =
        "message-file";

      fileBox.innerHTML =
        `📎 ${escapeHtml(
          attachment.name || "ملف مرفق"
        )}`;

      bubble.appendChild(fileBox);

    }


    /*
      النص
    */

    if (text) {

      const textElement =
        document.createElement("div");

      textElement.textContent =
        text;

      bubble.appendChild(
        textElement
      );

    }


    message.appendChild(
      avatar
    );

    message.appendChild(
      bubble
    );

    chat.appendChild(
      message
    );


    window.scrollTo({

      top:
        document.body.scrollHeight,

      behavior:
        "smooth"

    });


    return message;

  }


  /* =========================
     ESCAPE HTML
  ========================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     RENDER CONVERSATION
  ========================== */

  function renderConversation() {

    const conversation =
      getActiveConversation();


    if (
      !conversation ||
      !conversation.messages ||
      !conversation.messages.length
    ) {

      showWelcome();

      return;

    }


    chat.innerHTML = "";


    conversation.messages.forEach(
      message => {

        addMessage(
          message.role,
          message.content || "",
          message.attachment || null
        );

      }
    );

  }


  /* =========================
     RENDER LIST
  ========================== */

  function renderConversationList() {

    conversationList.innerHTML = "";


    if (!conversations.length) {

      conversationList.innerHTML = `

        <div class="conversation-empty">

          ما عندك محادثات محفوظة حالياً.

          <br>

          ابدأ محادثة جديدة
          من الزر أعلاه.

        </div>

      `;

      return;

    }


    conversations
      .slice()
      .reverse()
      .forEach(
        conversation => {

          const item =
            document.createElement("div");

          item.className =
            "conversation-item" +
            (
              conversation.id ===
              activeConversationId
                ? " active"
                : ""
            );


          const title =
            document.createElement("div");

          title.className =
            "conversation-title";

          title.textContent =
            conversation.title ||
            "محادثة جديدة";


          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "delete-conversation";

          deleteButton.textContent =
            "🗑";


          deleteButton.onclick =
            function(event) {

              event.stopPropagation();

              deleteConversation(
                conversation.id
              );

            };


          item.appendChild(title);

          item.appendChild(
            deleteButton
          );


          item.onclick =
            function() {

              openConversation(
                conversation.id
              );

            };


          conversationList.appendChild(
            item
          );

        }
      );

  }


  /* =========================
     OPEN CONVERSATION
  ========================== */

  function openConversation(id) {

    activeConversationId =
      id;

    saveActiveId();

    renderConversation();

    renderConversationList();

    closeMenu();

    input.focus();

  }


  /* =========================
     NEW CHAT
  ========================== */

  function newChat() {

    const newConversation = {

      id:
        createId(),

      title:
        "محادثة جديدة",

      messages:
        [],

      createdAt:
        Date.now()

    };


    conversations.push(
      newConversation
    );


    activeConversationId =
      newConversation.id;


    saveConversations();

    saveActiveId();

    renderConversation();

    renderConversationList();


    input.value =
      "";

    input.style.height =
      "52px";


    removeAttachment();

    input.focus();

  }


  /* =========================
     DELETE CONVERSATION
  ========================== */

  function deleteConversation(id) {

    conversations =
      conversations.filter(
        conversation =>
          conversation.id !== id
      );


    if (
      activeConversationId === id
    ) {

      if (conversations.length) {

        activeConversationId =
          conversations[
            conversations.length - 1
          ].id;

      } else {

        activeConversationId =
          null;

      }

    }


    saveConversations();

    saveActiveId();

    renderConversation();

    renderConversationList();

  }


  /* =========================
     TYPING
  ========================== */

  function addTyping() {

    const message =
      document.createElement("div");

    message.className =
      "message assistant";

    message.id =
      "typingMessage";


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      "ت";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    bubble.innerHTML = `

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    `;


    message.appendChild(
      avatar
    );

    message.appendChild(
      bubble
    );

    chat.appendChild(
      message
    );


    window.scrollTo({

      top:
        document.body.scrollHeight,

      behavior:
        "smooth"

    });

  }


  function removeTyping() {

    const typing =
      document.getElementById(
        "typingMessage"
      );

    if (typing) {

      typing.remove();

    }

  }


  /* =========================
     FILE PICKER
  ========================== */

  attachButton.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      event.stopPropagation();

      fileInput.click();

    }
  );


  fileInput.addEventListener(
    "change",
    handleFileSelect
  );


  /* =========================
     FILE SIZE
  ========================== */

  function formatFileSize(bytes) {

    if (bytes < 1024) {

      return bytes + " B";

    }

    if (bytes < 1024 * 1024) {

      return (
        (bytes / 1024).toFixed(1) +
        " KB"
      );

    }

    if (bytes < 1024 * 1024 * 1024) {

      return (
        (bytes / (1024 * 1024))
          .toFixed(1) +
        " MB"
      );

    }

    return (
      (bytes / (1024 * 1024 * 1024))
        .toFixed(1) +
      " GB"
    );

  }


  /* =========================
     READ FILE
  ========================== */

  function readFileAsDataURL(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload =
          () => resolve(
            reader.result
          );


        reader.onerror =
          () => reject(
            new Error(
              "تعذر قراءة الملف."
            )
          );


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  /* =========================
     RESIZE IMAGE
  ========================== */

  async function resizeImage(
    file,
    maxSize = 1600,
    quality = 0.82
  ) {

    const dataUrl =
      await readFileAsDataURL(file);


    return new Promise(
      (resolve, reject) => {

        const img =
          new Image();


        img.onload =
          function() {

            let width =
              img.width;

            let height =
              img.height;


            if (
              width > maxSize ||
              height > maxSize
            ) {

              const ratio =
                Math.min(
                  maxSize / width,
                  maxSize / height
                );

              width =
                Math.round(
                  width * ratio
                );

              height =
                Math.round(
                  height * ratio
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            const output =
              canvas.toDataURL(
                "image/jpeg",
                quality
              );


            resolve(output);

          };


        img.onerror =
          () => reject(
            new Error(
              "تعذر معالجة الصورة."
            )
          );


        img.src =
          dataUrl;

      }
    );

  }


  /* =========================
     HANDLE FILE
  ========================== */

  async function handleFileSelect(event) {

    const file =
      event.target.files[0];


    if (!file) {

      return;

    }


    /*
      حد أقصى أولي
    */

    if (
      file.size >
      20 * 1024 * 1024
    ) {

      alert(
        "حجم الملف أكبر من 20MB."
      );

      removeAttachment();

      return;

    }


    selectedFile =
      file;


    attachmentName.textContent =
      file.name;


    attachmentSize.textContent =
      formatFileSize(
        file.size
      );


    attachmentPreview.classList.add(
      "active"
    );


    /*
      صورة
    */

    if (
      file.type.startsWith("image/")
    ) {

      try {

        const compressedImage =
          await resizeImage(
            file
          );


        selectedFileData = {

          type:
            "image",

          name:
            file.name,

          mime:
            "image/jpeg",

          data:
            compressedImage

        };


        attachmentImage.src =
          compressedImage;


        attachmentImage.style.display =
          "block";


        attachmentIcon.style.display =
          "none";


      } catch (error) {

        console.error(error);

        alert(
          "تعذر تجهيز الصورة."
        );

        removeAttachment();

      }


    } else {

      /*
        الملفات غير الصور
      */

      try {

        const data =
          await readFileAsDataURL(
            file
          );


        selectedFileData = {

          type:
            "file",

          name:
            file.name,

          mime:
            file.type ||
            "application/octet-stream",

          data:
            data

        };


      } catch (error) {

        console.error(error);

        alert(
          "تعذر قراءة الملف."
        );

        removeAttachment();

        return;

      }


      attachmentImage.style.display =
        "none";


      attachmentIcon.style.display =
        "flex";


      if (
        file.type ===
        "application/pdf"
      ) {

        attachmentIcon.textContent =
          "📄";

      } else {

        attachmentIcon.textContent =
          "📎";

      }

    }

  }


  /* =========================
     REMOVE ATTACHMENT
  ========================== */

  function removeAttachment() {

    selectedFile =
      null;


    selectedFileData =
      null;


    fileInput.value =
      "";


    attachmentPreview.classList.remove(
      "active"
    );


    attachmentImage.src =
      "";


    attachmentImage.style.display =
      "none";


    attachmentIcon.style.display =
      "flex";


    attachmentIcon.textContent =
      "📎";


    attachmentName.textContent =
      "";


    attachmentSize.textContent =
      "";

  }


  /* =========================
     SEND MESSAGE
  ========================== */

  async function sendMessage() {

    if (isSending) {

      return;

    }


    const text =
      input.value.trim();


    /*
      لازم نص أو مرفق
    */

    if (
      !text &&
      !selectedFileData
    ) {

      return;

    }


    /*
      إنشاء محادثة تلقائياً
    */

    if (!activeConversationId) {

      const newConversation = {

        id:
          createId(),

        title:
          text
            ? text.slice(0, 35)
            : (
              selectedFile
                ? selectedFile.name.slice(
                    0,
                    35
                  )
                : "محادثة جديدة"
            ),

        messages:
          [],

        createdAt:
          Date.now()

      };


      conversations.push(
        newConversation
      );


      activeConversationId =
        newConversation.id;


      saveActiveId();

    }


    const conversation =
      getActiveConversation();


    if (!conversation) {

      return;

    }


    /*
      تجهيز رسالة المستخدم
    */

    const messageText =
      text;


    const attachment =
      selectedFileData
        ? {
            ...selectedFileData
          }
        : null;


    /*
      حفظ الرسالة محلياً
    */

    conversation.messages.push({

      role:
        "user",

      content:
        messageText,

      attachment:
        attachment

    });


    /*
      عنوان المحادثة
    */

    if (
      conversation.messages.length === 1
    ) {

      const titleText =
        messageText ||
        (
          attachment
            ? attachment.name
            : "محادثة جديدة"
        );


      conversation.title =
        titleText.length > 35
          ? titleText.slice(0, 35) + "..."
          : titleText;

    }


    saveConversations();

    renderConversationList();


    /*
      عرض الرسالة
    */

    addMessage(
      "user",
      messageText,
      attachment
    );


    /*
      تنظيف الإدخال
    */

    input.value =
      "";

    input.style.height =
      "52px";


    removeAttachment();


    /*
      حالة الإرسال
    */

    isSending =
      true;

    sendButton.disabled =
      true;

    sendButton.textContent =
      "…";


    addTyping();


    try {

      /*
        نرسل آخر الرسائل
        إلى السيرفر.

        يتم أخذ آخر 30 رسالة
        حتى لا يكبر الطلب بلا حدود.
      */

      const apiMessages =
        conversation.messages
          .slice(-30)
          .map(message => {

            /*
              إذا توجد صورة
            */

            if (
              message.attachment &&
              message.attachment.type === "image"
            ) {

              const content = [];


              if (message.content) {

                content.push({

                  type:
                    "input_text",

                  text:
                    message.content

                });

              }


              content.push({

                type:
                  "input_image",

                image_url:
                  message.attachment.data

              });


              return {

                role:
                  message.role,

                content:
                  content

              };

            }


            /*
              الرسائل العادية
            */

            return {

              role:
                message.role,

              content:
                String(
                  message.content || ""
                )

            };

          });


      const response =
        await fetch(
          "/api/chat",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                messages:
                  apiMessages

              })

          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = {};

      }


      removeTyping();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "حدث خطأ من الخادم."
        );

      }


      const reply =
        data.reply ||
        "ما حصلت جواب.";


      conversation.messages.push({

        role:
          "assistant",

        content:
          reply

      });


      saveConversations();


      addMessage(
        "assistant",
        reply
      );


    } catch (error) {

      removeTyping();


      console.error(
        "Send Error:",
        error
      );


      addMessage(
        "assistant",
        "عذراً، صار خطأ بالاتصال بالخادم.\n\n" +
        (
          error?.message ||
          "حاول مرة ثانية."
        )
      );

    } finally {

      isSending =
        false;

      sendButton.disabled =
        false;

      sendButton.textContent =
        "↑";

      input.focus();

    }

  }


  /* =========================
     SEND BUTTON
  ========================== */

  sendButton.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      sendMessage();

    }
  );


  /* =========================
     MENU
  ========================== */

  function toggleMenu() {

    sidePanel.classList.toggle(
      "active"
    );

    sideOverlay.classList.toggle(
      "active"
    );

  }


  function closeMenu() {

    sidePanel.classList.remove(
      "active"
    );

    sideOverlay.classList.remove(
      "active"
    );

  }


  window.toggleMenu =
    toggleMenu;


  window.closeMenu =
    closeMenu;


  sideOverlay.addEventListener(
    "click",
    closeMenu
  );


  closeMenuButton.addEventListener(
    "click",
    closeMenu
  );


  sideNewChat.addEventListener(
    "click",
    function() {

      newChat();

      closeMenu();

    }
  );


  /* =========================
     NEW CHAT HEADER
  ========================== */

  document
    .querySelector(".new-chat")
    .addEventListener(
      "click",
      newChat
    );


  /* =========================
     TEXTAREA AUTO HEIGHT
  ========================== */

  input.addEventListener(
    "input",
    function() {

      this.style.height =
        "52px";


      this.style.height =
        Math.min(
          this.scrollHeight,
          150
        ) + "px";

    }
  );


  /* =========================
     ENTER TO SEND
  ========================== */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================
     START APP
  ========================== */

  function startApp() {

    if (!conversations.length) {

      activeConversationId =
        null;

      saveActiveId();

      showWelcome();

    } else {

      let active =
        getActiveConversation();


      if (!active) {

        activeConversationId =
          conversations[
            conversations.length - 1
          ].id;

        saveActiveId();

      }


      renderConversation();

    }


    renderConversationList();

  }


  startApp();

</script>
