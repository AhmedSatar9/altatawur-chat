<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#070b18"
    >

    <title>التطور چات</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            background: #070b18;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            min-height: 100dvh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(128, 85, 246, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(34, 200, 233, 0.12),
                    transparent 30%
                ),
                #070b18;

            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .hidden {
            display: none !important;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            flex: 0 0 auto;

            min-height: 82px;

            padding:
                12px
                20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(8, 13, 29, 0.92);

            border-bottom:
                1px solid
                rgba(140, 155, 200, 0.12);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            position: relative;
            z-index: 20;
        }


        /* BRAND */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            min-width: 0;
        }

        .brand-logo {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            color: #ffffff;

            font-size: 29px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );

            box-shadow:
                0 10px 30px
                rgba(60, 160, 235, 0.20);
        }

        .brand-info {
            min-width: 0;
        }

        .brand-info h1 {
            margin: 0;

            font-size: 23px;
            line-height: 1.2;

            font-weight: 750;

            white-space: nowrap;
        }

        .online-status {
            margin-top: 4px;

            display: flex;
            align-items: center;

            color: #65dfbd;

            font-size: 12px;
        }

        .online-dot {
            width: 7px;
            height: 7px;

            margin-left: 6px;

            border-radius: 50%;

            background: #65dfbd;

            box-shadow:
                0 0 10px
                rgba(101, 223, 189, 0.55);
        }

        /* CURRENT CHAT */

        .current-chat {
            display: none;

            margin-top: 3px;

            max-width: 340px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #858da8;

            font-size: 11px;
        }

        .current-chat.visible {
            display: block;
        }


        /* HEADER BUTTONS */

        .header-actions {
            display: flex;
            align-items: center;

            gap: 9px;
        }

        .header-button {
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                0
                15px;

            border:
                1px solid
                rgba(140, 155, 200, 0.17);

            border-radius: 14px;

            color: #ffffff;

            background:
                rgba(16, 23, 46, 0.80);

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .header-button:active {
            transform: scale(0.96);
        }

        .new-chat-button {
            font-size: 14px;
        }

        .menu-button {
            width: 46px;

            padding: 0;

            font-size: 22px;
        }


        /* =====================================================
           CHAT AREA
        ===================================================== */

        .chat-area {
            flex: 1;

            min-height: 0;

            width: 100%;

            position: relative;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .messages {
            flex: 1;

            width: 100%;

            max-width: 980px;

            margin:
                0 auto;

            padding:
                24px
                20px
                145px;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-behavior: smooth;

            scrollbar-width: thin;

            scrollbar-color:
                rgba(120, 130, 170, 0.30)
                transparent;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background:
                rgba(120, 130, 170, 0.30);

            border-radius: 20px;
        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                30px
                0
                80px;
        }

        .welcome-content {
            width: 100%;
            max-width: 620px;

            text-align: center;
        }

        .welcome-logo {
            width: 76px;
            height: 76px;

            margin:
                0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            font-size: 39px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );

            box-shadow:
                0 18px 50px
                rgba(65, 155, 235, 0.20);
        }

        .welcome h2 {
            margin:
                0 0 10px;

            font-size: 30px;
            font-weight: 750;
        }

        .welcome p {
            margin: 0;

            color: #858da8;

            font-size: 16px;
            line-height: 1.8;
        }

        .suggestions {
            margin-top: 28px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        .suggestion {
            min-height: 62px;

            padding:
                12px
                15px;

            text-align: right;

            color: #d8dced;

            background:
                rgba(15, 23, 46, 0.70);

            border:
                1px solid
                rgba(130, 145, 190, 0.13);

            border-radius: 17px;

            cursor: pointer;

            font-size: 14px;
            line-height: 1.5;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .suggestion:active {
            transform: scale(0.98);
        }


        /* =====================================================
           MESSAGE BUBBLES
        ===================================================== */

        .message-row {
            width: 100%;

            display: flex;

            margin-bottom: 15px;
        }

        .message-row.user {
            justify-content: flex-start;
        }

        .message-row.assistant {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(78%, 720px);

            padding:
                14px
                17px;

            border-radius: 20px;

            font-size: 16px;
            line-height: 1.8;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message-row.user .message-bubble {
            background:
                linear-gradient(
                    135deg,
                    #7752ef,
                    #398fe4
                );

            border-bottom-right-radius: 7px;
        }

        .message-row.assistant .message-bubble {
            background:
                #11182d;

            border:
                1px solid
                rgba(130, 145, 190, 0.13);

            border-bottom-left-radius: 7px;
        }

        .message-bubble.loading {
            color: #8c96b0;
        }

        .message-bubble.error {
            color: #ff9eaa;

            border-color:
                rgba(255, 80, 105, 0.25);
        }


        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-wrap {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                15px
                20px
                calc(15px + env(safe-area-inset-bottom));

            pointer-events: none;

            background:
                linear-gradient(
                    to top,
                    #070b18 45%,
                    rgba(7, 11, 24, 0.88) 75%,
                    transparent
                );
        }

        .composer {
            width: 100%;
            max-width: 980px;

            margin:
                0 auto;

            display: flex;
            align-items: flex-end;

            gap: 9px;

            padding:
                9px;

            pointer-events: auto;

            background:
                rgba(14, 21, 42, 0.96);

            border:
                1px solid
                rgba(135, 150, 195, 0.20);

            border-radius: 23px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.28);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .message-input {
            flex: 1;

            width: 100%;

            min-height: 50px;
            max-height: 140px;

            padding:
                13px
                12px;

            resize: none;

            border: 0;
            outline: 0;

            color: #ffffff;

            background: transparent;

            font-size: 16px;
            line-height: 1.55;
        }

        .message-input::placeholder {
            color: #707993;
        }

        .send-button {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            border-radius: 17px;

            color: #ffffff;

            font-size: 27px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .send-button:active {
            transform: scale(0.94);
        }

        .send-button:disabled {
            opacity: 0.45;

            cursor: wait;
        }


        /* =====================================================
           SIDE MENU
        ===================================================== */

        .menu-overlay {
            position: fixed;

            inset: 0;

            z-index: 90;

            background:
                rgba(0, 0, 0, 0.48);

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            opacity: 1;

            transition:
                opacity 0.22s ease;
        }

        .menu-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            z-index: 100;

            width: min(
                390px,
                88vw
            );

            height: 100dvh;

            padding:
                22px;

            background:
                #0b1124;

            border-left:
                1px solid
                rgba(130, 145, 190, 0.17);

            box-shadow:
                -25px 0 70px
                rgba(0, 0, 0, 0.40);

            transform:
                translateX(100%);

            transition:
                transform 0.25s ease;

            overflow-y: auto;
        }

        .side-menu.open {
            transform:
                translateX(0);
        }


        /* MENU HEADER */

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-header h2 {
            margin: 0;

            font-size: 26px;
        }

        .close-menu {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(130, 145, 190, 0.18);

            border-radius: 14px;

            background:
                rgba(16, 23, 46, 0.80);

            color: #ffffff;

            font-size: 27px;

            cursor: pointer;
        }


        /* ACCOUNT */

        .account-card {
            margin-top: 25px;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 15px;

            border:
                1px solid
                rgba(130, 145, 190, 0.15);

            border-radius: 19px;

            background:
                #11182d;
        }

        .account-avatar {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            font-size: 21px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #22c8e9
                );
        }

        .account-info small {
            display: block;

            margin-bottom: 3px;

            color: #737d98;

            font-size: 12px;
        }

        .account-info strong {
            display: block;

            max-width: 240px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 15px;
        }


        /* MENU BUTTONS */

        .side-action {
            width: 100%;
            height: 56px;

            margin-top: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            font-size: 15px;

            cursor: pointer;
        }

        .new-side-chat {
            color: #ffffff;

            border:
                1px solid
                rgba(128, 85, 246, 0.48);

            background:
                rgba(128, 85, 246, 0.08);
        }

        .logout-button {
            color: #ffffff;

            border: 0;

            background:
                linear-gradient(
                    100deg,
                    #8055f6,
                    #22c8e9
                );
        }


        /* =====================================================
           CONVERSATIONS LIST
        ===================================================== */

        .conversation-section {
            margin-top: 28px;
        }

        .conversation-section-title {
            margin-bottom: 10px;

            color: #737d98;

            font-size: 13px;
            font-weight: 600;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .conversation-item {
            width: 100%;

            min-height: 54px;

            padding:
                10px
                13px;

            display: flex;
            align-items: center;

            text-align: right;

            border:
                1px solid
                transparent;

            border-radius: 15px;

            color: #d8dced;

            background:
                rgba(16, 23, 46, 0.62);

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .conversation-item:hover {
            background:
                rgba(25, 34, 63, 0.90);
        }

        .conversation-item.active {
            background:
                rgba(128, 85, 246, 0.13);

            border-color:
                rgba(128, 85, 246, 0.35);
        }

        .conversation-item-icon {
            width: 34px;
            height: 34px;

            flex: 0 0 34px;

            margin-left: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                rgba(128, 85, 246, 0.14);

            font-size: 15px;
        }

        .conversation-item-content {
            min-width: 0;
        }

        .conversation-item-title {
            display: block;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #ffffff;

            font-size: 13px;
        }

        .conversation-item-date {
            display: block;

            margin-top: 3px;

            color: #6f7892;

            font-size: 10px;
        }

        .conversation-empty {
            padding:
                20px
                8px;

            text-align: center;

            color: #68728d;

            font-size: 13px;

            line-height: 1.7;
        }

        .conversation-loading {
            padding:
                20px
                8px;

            text-align: center;

            color: #7c86a0;

            font-size: 13px;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            left: 50%;

            bottom:
                105px;

            z-index: 200;

            transform:
                translateX(-50%)
                translateY(20px);

            min-width: 220px;
            max-width: 90vw;

            padding:
                12px
                17px;

            text-align: center;

            border:
                1px solid
                rgba(130, 145, 190, 0.18);

            border-radius: 14px;

            color: #ffffff;

            background:
                rgba(15, 22, 43, 0.96);

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.30);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .topbar {
                min-height: 70px;

                padding:
                    10px
                    13px;
            }

            .brand {
                gap: 9px;
            }

            .brand-logo {
                width: 44px;
                height: 44px;

                flex-basis: 44px;

                border-radius: 14px;

                font-size: 25px;
            }

            .brand-info h1 {
                font-size: 20px;
            }

            .online-status {
                font-size: 11px;
            }

            .current-chat {
                max-width: 200px;

                font-size: 10px;
            }

            .header-actions {
                gap: 6px;
            }

            .new-chat-button {
                display: none;
            }

            .menu-button {
                width: 43px;
                height: 43px;
            }

            .messages {
                padding:
                    18px
                    12px
                    135px;
            }

            .welcome {
                padding:
                    15px
                    0
                    80px;
            }

            .welcome-logo {
                width: 66px;
                height: 66px;

                border-radius: 21px;

                font-size: 34px;
            }

            .welcome h2 {
                font-size: 25px;
            }

            .welcome p {
                font-size: 14px;
            }

            .suggestions {
                grid-template-columns: 1fr;

                margin-top: 22px;
            }

            .suggestion {
                min-height: 54px;
            }

            .message-bubble {
                max-width: 88%;

                font-size: 15px;

                padding:
                    12px
                    14px;
            }

            .composer-wrap {
                padding:
                    9px
                    10px
                    calc(9px + env(safe-area-inset-bottom));
            }

            .composer {
                border-radius: 20px;
            }

            .message-input {
                font-size: 15px;

                min-height: 47px;
            }

            .send-button {
                width: 49px;
                height: 49px;

                flex-basis: 49px;

                border-radius: 15px;

                font-size: 25px;
            }

            .side-menu {
                width: 90vw;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .brand-info h1 {
                font-size: 18px;
            }

            .brand-logo {
                width: 41px;
                height: 41px;

                flex-basis: 41px;
            }

            .message-bubble {
                max-width: 92%;
            }

            .current-chat {
                max-width: 155px;
            }
        }

    </style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                ت
            </div>

            <div class="brand-info">

                <h1>
                    التطور چات
                </h1>

                <div class="online-status">

                    <span class="online-dot"></span>

                    متصل الآن

                </div>

                <div
                    id="currentChatTitle"
                    class="current-chat"
                >
                    محادثة جديدة
                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                id="newChatButton"
                class="header-button new-chat-button"
                type="button"
            >
                + محادثة جديدة
            </button>


            <button
                id="menuButton"
                class="header-button menu-button"
                type="button"
                aria-label="فتح القائمة"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- =====================================================
         CHAT
    ===================================================== -->

    <main class="chat-area">

        <section
            id="messages"
            class="messages"
        >

            <!-- WELCOME -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-content">

                    <div class="welcome-logo">
                        ت
                    </div>

                    <h2>
                        شلون أگدر أساعدك؟
                    </h2>

                    <p>
                        اسألني عن أي موضوع، وأنا أساعدك بالمعلومات والأفكار والحلول.
                    </p>


                    <div class="suggestions">

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="اكتبلي فكرة مشروع صغيرة ومربحة"
                        >
                            💡 اقترحلي فكرة مشروع
                        </button>


                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="ساعدني أكتب إعلان احترافي وجذاب"
                        >
                            ✍️ اكتبلي إعلان
                        </button>


                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="اشرحلي الذكاء الاصطناعي بطريقة بسيطة"
                        >
                            🤖 اشرحلي الذكاء الاصطناعي
                        </button>


                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="ساعدني أخطط لشيء أريد أسويه"
                        >
                            📋 ساعدني بالتخطيط
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================= -->

        <div class="composer-wrap">

            <div class="composer">

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="اكتب سؤالك هنا..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    aria-label="إرسال"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     MENU OVERLAY
========================================================= -->

<div
    id="menuOverlay"
    class="menu-overlay hidden"
></div>


<!-- =========================================================
     SIDE MENU
========================================================= -->

<aside
    id="sideMenu"
    class="side-menu"
    aria-hidden="true"
>

            ×

    <div class="account-card">

        <div class="account-avatar">

        </div>

        <div class="account-info">

            <small>

            <strong id="usernameDisplay">
                جاري التحميل...
            </strong>

        </div>

    </div>


    <!-- NEW CHAT -->

    <button
        id="newChatSide"

        + محادثة جديدة
    </button>

    <div class="conversation-section">

        <div class="conversation-section-title">
            المحادثات السابقة
        </div>

        <div
            id="conversationList"

        >

            <div class="conversation-loading">
                جاري تحميل المحادثات...
            </div>

    <button

</aside>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
></div>


<script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
        "https://wxsricscchalzvazdbzd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_5oPDD77Veu5OczxaZje7vg_orfNjB5t";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const messages =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const newChatButton =
        document.getElementById("newChatButton");

    const newChatSide =
        document.getElementById("newChatSide");

    const menuButton =
        document.getElementById("menuButton");

    const closeMenu =
        document.getElementById("closeMenu");

    const sideMenu =
        document.getElementById("sideMenu");

    const menuOverlay =
        document.getElementById("menuOverlay");

    const logoutButton =
        document.getElementById("logoutButton");

    const usernameDisplay =
        document.getElementById("usernameDisplay");

    const toast =
        document.getElementById("toast");

    const conversationList =
        document.getElementById("conversationList");

    const currentChatTitle =
        document.getElementById("currentChatTitle");


    /* =========================================================
       STATE
    ========================================================= */

    let currentUser = null;

    /*
        جميع رسائل المحادثة المفتوحة حالياً
    */
    let conversation = [];

    /*
        ID المحادثة المفتوحة حالياً
    */
    let currentConversationId = null;

    /*
        عنوان المحادثة المفتوحة حالياً
    */
    let currentConversationTitle = "";

    let isSending = false;

    let toastTimer = null;


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(text) {

        if (!toast) {
            return;
        }

        toast.textContent = text;

        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer =
            setTimeout(() => {

                toast.classList.remove("show");

            }, 2500);

    }


    /* =========================================================
       MENU
    ========================================================= */

    function openMenu() {

        sideMenu.classList.add("open");

        menuOverlay.classList.remove("hidden");

        sideMenu.setAttribute(
            "aria-hidden",
            "false"
        );

        /*
            تحديث قائمة المحادثات كل مرة نفتح القائمة
        */
        loadConversations();

    }


    function closeMenuPanel() {

        sideMenu.classList.remove("open");

        menuOverlay.classList.add("hidden");

        sideMenu.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    menuButton.addEventListener(
        "click",
        openMenu
    );


    closeMenu.addEventListener(
        "click",
        closeMenuPanel
    );


    menuOverlay.addEventListener(
        "click",
        closeMenuPanel
    );


    /* =========================================================
       CURRENT CHAT UI
    ========================================================= */

    function updateCurrentChatUI(title) {

        currentConversationTitle =
            title || "";

        if (!title) {

            currentChatTitle.classList.remove(
                "visible"
            );

            currentChatTitle.textContent =
                "";

            return;
        }

        currentChatTitle.textContent =
            title;

        currentChatTitle.classList.add(
            "visible"
        );

    }


    /* =========================================================
       RESET CHAT SCREEN
    ========================================================= */

    function clearChatScreen() {

        messages.innerHTML = "";

        messages.appendChild(
            welcome
        );

        welcome.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       NEW CHAT
    ========================================================= */

    function startNewChat() {

        /*
            مهم جداً:
            تصفير ID حتى الرسالة القادمة
            تنشئ محادثة جديدة في Supabase
        */

        currentConversationId = null;

        currentConversationTitle = "";

        conversation = [];

        clearChatScreen();

        updateCurrentChatUI("");

        messageInput.value = "";

        messageInput.style.height =
            "auto";

        closeMenuPanel();

        messageInput.focus();

        /*
            تحديث الحالة البصرية للقائمة
        */
        updateConversationActiveState();

    }


    newChatButton.addEventListener(
        "click",
        startNewChat
    );


    newChatSide.addEventListener(
        "click",
        startNewChat
    );


    /* =========================================================
       ADD MESSAGE TO SCREEN
    ========================================================= */

    function addMessage(
        text,
        role
    ) {

        if (welcome) {

            welcome.classList.add(
                "hidden"
            );

        }


        const row =
            document.createElement("div");


        row.className =
            `message-row ${role}`;


        const bubble =
            document.createElement("div");


        bubble.className =
            "message-bubble";


        bubble.textContent =
            text;


        row.appendChild(
            bubble
        );


        messages.appendChild(
            row
        );


        scrollToBottom();


        return row;

    }


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading() {

        if (welcome) {

            welcome.classList.add(
                "hidden"
            );

        }


        const row =
            document.createElement("div");


        row.className =
            "message-row assistant";


        const bubble =
            document.createElement("div");


        bubble.className =
            "message-bubble loading";


        bubble.textContent =
            "جاري التفكير...";


        row.appendChild(
            bubble
        );


        messages.appendChild(
            row
        );


        scrollToBottom();


        return row;

    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }


    /* =========================================================
       AUTO RESIZE
    ========================================================= */

    function resizeInput() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                140
            ) + "px";

    }


    messageInput.addEventListener(
        "input",
        resizeInput
    );


    /* =========================================================
       CREATE CONVERSATION
    ========================================================= */

    async function createConversation(
        firstMessage
    ) {

        if (!currentUser) {

            throw new Error(
                "المستخدم غير مسجل الدخول."
            );

        }


        const cleanTitle =
            firstMessage
                .replace(/\s+/g, " ")
                .trim();


        const title =
            cleanTitle.length > 60
                ? cleanTitle.substring(0, 60) + "..."
                : cleanTitle;


        const {
            data,
            error
        } =
            await supabaseClient
                .from("conversations")
                .insert({

                    user_id:
                        currentUser.id,

                    title:
                        title

                })
                .select()
                .single();


        if (error) {

            console.error(
                "CREATE CONVERSATION ERROR:",
                error
            );

            throw new Error(
                "تعذر إنشاء المحادثة."
            );

        }


        currentConversationId =
            data.id;


        updateCurrentChatUI(
            data.title
        );


        return data;

    }


    /* =========================================================
       SAVE MESSAGE
    ========================================================= */

    async function saveMessage(
        role,
        content
    ) {

        if (!currentConversationId) {

            throw new Error(
                "لا توجد محادثة مفتوحة."
            );

        }


        const {
            error
        } =
            await supabaseClient
                .from("messages")
                .insert({

                    conversation_id:
                        currentConversationId,

                    role:
                        role,

                    content:
                        content

                });


        if (error) {

            console.error(
                "SAVE MESSAGE ERROR:",
                error
            );

            throw new Error(
                "تعذر حفظ الرسالة."
            );

        }


        /*
            تحديث وقت آخر تعديل للمحادثة
        */

        const {
            error: updateError
        } =
            await supabaseClient
                .from("conversations")
                .update({

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    currentConversationId
                );


        if (updateError) {

            console.error(
                "UPDATE CONVERSATION ERROR:",
                updateError
            );

        }

    }


    /* =========================================================
       LOAD CONVERSATIONS LIST
    ========================================================= */

    async function loadConversations() {

        if (!currentUser) {
            return;
        }


        conversationList.innerHTML = `
            <div class="conversation-loading">
                جاري تحميل المحادثات...
            </div>
        `;


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("conversations")
                    .select(
                        "id,title,created_at,updated_at"
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .order(
                        "updated_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                throw error;

            }


            conversationList.innerHTML =
                "";


            if (!data || data.length === 0) {

                conversationList.innerHTML = `
                    <div class="conversation-empty">
                        ما عندك محادثات سابقة حالياً.
                    </div>
                `;

                return;

            }


            data.forEach(
                (item) => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "conversation-item";


                    button.dataset.id =
                        item.id;


                    button.innerHTML = `
                        <span class="conversation-item-icon">
                            💬
                        </span>

                        <span class="conversation-item-content">

                            <span class="conversation-item-title"></span>

                            <span class="conversation-item-date">
                                ${formatConversationDate(item.updated_at)}
                            </span>

                        </span>
                    `;


                    const titleElement =
                        button.querySelector(
                            ".conversation-item-title"
                        );


                    titleElement.textContent =
                        item.title ||
                        "محادثة جديدة";


                    button.addEventListener(
                        "click",
                        () => {

                            openConversation(
                                item.id
                            );

                        }
                    );


                    conversationList.appendChild(
                        button
                    );

                }
            );


            updateConversationActiveState();


        } catch (error) {

            console.error(
                "LOAD CONVERSATIONS ERROR:",
                error
            );


            conversationList.innerHTML = `
                <div class="conversation-empty">
                    تعذر تحميل المحادثات.
                </div>
            `;

        }

    }


    /* =========================================================
       FORMAT DATE
    ========================================================= */

    function formatConversationDate(
        date
    ) {

        if (!date) {
            return "";
        }


        try {

            const value =
                new Date(date);


            return value.toLocaleDateString(
                "ar-IQ",
                {
                    day: "numeric",
                    month: "short"
                }
            );


        } catch {

            return "";

        }

    }


    /* =========================================================
       UPDATE ACTIVE CONVERSATION
    ========================================================= */

    function updateConversationActiveState() {

        document
            .querySelectorAll(
                ".conversation-item"
            )
            .forEach(
                (item) => {

                    item.classList.toggle(
                        "active",
                        item.dataset.id ===
                        currentConversationId
                    );

                }
            );

    }


    /* =========================================================
       LOAD SINGLE CONVERSATION
    ========================================================= */

    async function openConversation(
        conversationId
    ) {

        if (!currentUser) {
            return;
        }


        if (!conversationId) {
            return;
        }


        if (isSending) {

            showToast(
                "انتظر حتى يكتمل الرد الحالي."
            );

            return;

        }


        try {

            /*
                أولاً نجلب بيانات المحادثة
            */

            const {
                data: conversationData,
                error: conversationError
            } =
                await supabaseClient
                    .from("conversations")
                    .select(
                        "id,title,user_id"
                    )
                    .eq(
                        "id",
                        conversationId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .single();


            if (conversationError) {

                throw conversationError;

            }


            /*
                بعدها نجلب الرسائل
            */

            const {
                data: messageData,
                error: messageError
            } =
                await supabaseClient
                    .from("messages")
                    .select(
                        "id,conversation_id,role,content,created_at"
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            if (messageError) {

                throw messageError;

            }


            /*
                تحديد المحادثة الحالية
            */

            currentConversationId =
                conversationData.id;


            currentConversationTitle =
                conversationData.title ||
                "محادثة جديدة";


            updateCurrentChatUI(
                currentConversationTitle
            );


            /*
                تجهيز conversation
                لإرسال السياق الكامل إلى API
            */

            conversation =
                (messageData || []).map(
                    (message) => ({

                        role:
                            message.role,

                        content:
                            message.content

                    })
                );


            /*
                تنظيف الشاشة
            */

            messages.innerHTML = "";


            /*
                عرض الرسائل
            */

            if (
                !messageData ||
                messageData.length === 0
            ) {

                messages.appendChild(
                    welcome
                );

                welcome.classList.remove(
                    "hidden"
                );

            } else {

                welcome.classList.add(
                    "hidden"
                );


                messageData.forEach(
                    (message) => {

                        addMessage(
                            message.content,
                            message.role
                        );

                    }
                );

            }


            updateConversationActiveState();

            closeMenuPanel();

            scrollToBottom();


        } catch (error) {

            console.error(
                "OPEN CONVERSATION ERROR:",
                error
            );


            showToast(
                "تعذر فتح المحادثة."
            );

        }

    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        if (isSending) {
            return;
        }


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        if (!currentUser) {

            showToast(
                "يجب تسجيل الدخول أولاً."
            );

            setTimeout(() => {

                window.location.replace(
                    "/login.html"
                );

            }, 800);

            return;
        }


        isSending = true;

        sendButton.disabled = true;


        /*
            عرض رسالة المستخدم فوراً
        */

        addMessage(
            text,
            "user"
        );


        /*
            تنظيف الإدخال
        */

        messageInput.value = "";

        messageInput.style.height =
            "auto";


        const loading =
            showLoading();


        try {

            /* -----------------------------------------
               GET SESSION
            ----------------------------------------- */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (sessionError) {

                throw new Error(
                    "تعذر التحقق من جلسة تسجيل الدخول."
                );

            }


            const session =
                sessionData?.session;


            if (!session) {

                throw new Error(
                    "انتهت جلسة تسجيل الدخول. سجّل الدخول مرة أخرى."
                );

            }


            /* -----------------------------------------
               CREATE CONVERSATION IF NEEDED
            ----------------------------------------- */

            if (!currentConversationId) {

                await createConversation(
                    text
                );

            }


            /* -----------------------------------------
               ADD USER MESSAGE TO MEMORY
            ----------------------------------------- */

            conversation.push({

                role:
                    "user",

                content:
                    text

            });


            /* -----------------------------------------
               SAVE USER MESSAGE
            ----------------------------------------- */

            await saveMessage(
                "user",
                text
            );


            /* -----------------------------------------
               API
            ----------------------------------------- */

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${session.access_token}`

                        },

                        body:
                            JSON.stringify({

                                messages:
                                    conversation

                            })

                    }
                );


            let result = {};


            try {

                result =
                    await response.json();

            } catch {

                result = {};

            }


            if (!response.ok) {

                throw new Error(

                    result?.error ||
                    "حدث خطأ في الخادم."

                );

            }


            /* -----------------------------------------
               REMOVE LOADING
            ----------------------------------------- */

            if (loading) {

                loading.remove();

            }


            /* -----------------------------------------
               ANSWER
            ----------------------------------------- */

            const answer =
                result?.message ||
                result?.answer ||
                result?.content ||
                "لم يصل رد من المساعد.";


            /*
                عرض الرد
            */

            addMessage(
                answer,
                "assistant"
            );


            /*
                إضافة الرد إلى سياق المحادثة
            */

            conversation.push({

                role:
                    "assistant",

                content:
                    answer

            });


            /*
                حفظ رد المساعد
            */

            await saveMessage(
                "assistant",
                answer
            );


            /*
                تحديث قائمة المحادثات
            */

            await loadConversations();


        } catch (error) {

            console.error(
                "CHAT ERROR:",
                error
            );


            if (loading) {

                loading.remove();

            }


            /*
                مهم:
                لا نضيف رسالة الخطأ إلى conversation
                ولا نحفظها كرسالة للمساعد.
            */

            const row =
                addMessage(
                    error?.message ||
                    "حدث خطأ. حاول مرة أخرى.",
                    "assistant"
                );


            const bubble =
                row.querySelector(
                    ".message-bubble"
                );


            if (bubble) {

                bubble.classList.add(
                    "error"
                );

            }

        } finally {

            isSending = false;

            sendButton.disabled = false;

            messageInput.focus();

        }

    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =========================================================
       ENTER TO SEND
    ========================================================= */

    messageInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    document
        .querySelectorAll(".suggestion")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    const prompt =
                        button.dataset.prompt ||
                        "";

                    messageInput.value =
                        prompt;

                    resizeInput();

                    messageInput.focus();

                }
            );

        });


    /* =========================================================
       LOAD USER PROFILE
    ========================================================= */

    async function loadUserProfile() {

        if (!currentUser) {
            return;
        }


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "username,email"
                    )
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .single();


            if (!error && data) {

                usernameDisplay.textContent =
                    data.username ||
                    currentUser.email ||
                    "مستخدم";

            } else {

                usernameDisplay.textContent =
                    currentUser.user_metadata?.username ||
                    currentUser.email ||
                    "مستخدم";

            }

        } catch (error) {

            console.error(
                "PROFILE ERROR:",
                error
            );


            usernameDisplay.textContent =
                currentUser.user_metadata?.username ||
                currentUser.email ||
                "مستخدم";

        }

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logout() {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "جاري تسجيل الخروج...";


        try {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {
                throw error;
            }


            window.location.replace(
                "/login.html"
            );


        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );


            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "تسجيل الخروج";


            showToast(
                "تعذر تسجيل الخروج. حاول مرة أخرى."
            );

        }

    }


    logoutButton.addEventListener(
        "click",
        logout
    );


    /* =========================================================
       AUTH STATE
    ========================================================= */

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (
                event === "SIGNED_OUT" ||
                !session
            ) {

                window.location.replace(
                    "/login.html"
                );

            }

        }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initialize() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "SESSION ERROR:",
                    error
                );

                window.location.replace(
                    "/login.html"
                );

                return;

            }


            if (!data?.session) {

                window.location.replace(
                    "/login.html"
                );

                return;

            }


            currentUser =
                data.session.user;


            /*
                تحميل الحساب
            */

            await loadUserProfile();


            /*
                تحميل المحادثات السابقة
            */

            await loadConversations();


            /*
                هنا نحاول استرجاع آخر محادثة
                مفتوحة لهذا المستخدم.

                نجيب آخر محادثة معدلة.
            */

            const {
                data: latestConversation,
                error: latestError
            } =
                await supabaseClient
                    .from("conversations")
                    .select(
                        "id,title"
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .order(
                        "updated_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1)
                    .maybeSingle();


            if (
                !latestError &&
                latestConversation
            ) {

                await openConversation(
                    latestConversation.id
                );

            } else {

                /*
                    إذا ماكو محادثات
                */

                startNewChat();

            }


            messageInput.focus();


        } catch (error) {

            console.error(
                "INITIALIZE ERROR:",
                error
            );


            window.location.replace(
                "/login.html"
            );

        }

    }


    /* =========================================================
       START
    ========================================================= */

    initialize();

</script>
