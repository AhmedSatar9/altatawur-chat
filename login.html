<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل الدخول — التطور چات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#070912;--panel:#0d1222;--panel2:#11182a;--border:rgba(255,255,255,.10);--text:#f5f7ff;--muted:#8d96aa;--purple:#8b5cf6;--cyan:#22d3ee;--gradient:linear-gradient(135deg,#8b5cf6,#22d3ee)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:var(--bg)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
    body:before{content:"";position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.16),transparent 65%);top:-180px;right:-160px;pointer-events:none}
    body:after{content:"";position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.10),transparent 65%);bottom:-220px;left:-180px;pointer-events:none}
    .card{width:100%;max-width:440px;background:rgba(13,18,34,.94);border:1px solid var(--border);border-radius:28px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;z-index:1}
    .brand{text-align:center;margin-bottom:26px}.logo{width:76px;height:76px;border-radius:23px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:0 auto 16px;box-shadow:0 18px 50px rgba(100,90,255,.2)}
    h1{font-size:28px;margin-bottom:7px}.subtitle{color:var(--muted);font-size:14px;line-height:1.7}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#090e1b;padding:5px;border-radius:15px;margin:22px 0}.tab{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:11px;cursor:pointer;font-size:14px}.tab.active{background:var(--panel2);color:#fff}
    .form{display:flex;flex-direction:column;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:#cfd5e5}.field input{width:100%;height:50px;border:1px solid var(--border);border-radius:14px;background:#090e1b;color:#fff;outline:none;padding:0 14px;font-size:15px;direction:ltr;text-align:left}.field input:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(139,92,246,.10)}
    .submit{height:52px;border:0;border-radius:15px;background:var(--gradient);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.55;cursor:not-allowed}
    .message{display:none;padding:12px 14px;border-radius:13px;font-size:13px;line-height:1.7;margin-bottom:13px}.message.show{display:block}.message.success{background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.2);color:#9af0c9}.message.error{background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.2);color:#ffb0bd}
    .terms{text-align:center;color:#68738b;font-size:11px;line-height:1.7;margin-top:17px}.back{display:block;text-align:center;color:#9ea8bb;text-decoration:none;font-size:13px;margin-top:18px}.back:hover{color:#fff}
    .verify{display:none;text-align:center;padding:14px 0 3px}.verify.show{display:block}.verify-icon{font-size:38px;margin-bottom:10px}.verify h2{font-size:20px;margin-bottom:8px}.verify p{color:var(--muted);font-size:13px;line-height:1.8}
    @media(max-width:480px){body{padding:14px}.card{padding:23px 18px;border-radius:23px}.logo{width:68px;height:68px}.brand{margin-bottom:18px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">ت</div>
      <h1>التطور چات</h1>
      <p class="subtitle">سجّل دخولك حتى تبدأ محادثاتك مع المساعد الذكي.</p>
    </div>

    <div id="message" class="message"></div>

    <section id="authSection">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">تسجيل الدخول</button>
        <button class="tab" id="signupTab" type="button">إنشاء حساب</button>
      </div>

      <form class="form" id="authForm">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="email" required placeholder="example@email.com">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••">
        </div>
        <button class="submit" id="submitButton" type="submit">تسجيل الدخول</button>
      </form>
    </section>

    <section class="verify" id="verifySection">
      <div class="verify-icon">📩</div>
      <h2>تحقق من بريدك الإلكتروني</h2>
      <p>أرسلنا لك رسالة تأكيد. افتح بريدك واضغط رابط التأكيد، وبعدها ارجع للموقع وسجّل دخولك.</p>
      <button class="submit" id="backToLogin" type="button" style="margin-top:18px;width:100%">العودة لتسجيل الدخول</button>
    </section>

    <p class="terms">باستخدامك التطور چات، أنت توافق على استخدام الخدمة وفق إعدادات المنصة.</p>
    <a class="back" href="/">العودة إلى التطور چات</a>
  </main>

  <script>
    const SUPABASE_URL = "https://wxsricscchalzvazdbzd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5oPDD77Veu5OczxaZje7vg_orfNjB5t";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const authSection = document.getElementById("authSection");
    const verifySection = document.getElementById("verifySection");
    const backToLogin = document.getElementById("backToLogin");
    let mode = "login";

    function showMessage(text, type="error") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }
    function clearMessage() { message.className = "message"; message.textContent = ""; }

    function setMode(nextMode) {
      mode = nextMode;
      clearMessage();
      loginTab.classList.toggle("active", mode === "login");
      signupTab.classList.toggle("active", mode === "signup");
      submitButton.textContent = mode === "login" ? "تسجيل الدخول" : "إنشاء الحساب";
      passwordInput.autocomplete = mode === "login" ? "current-password" : "new-password";
    }
    loginTab.onclick = () => setMode("login");
    signupTab.onclick = () => setMode("signup");
    backToLogin.onclick = () => {
      verifySection.classList.remove("show");
      authSection.style.display = "block";
      setMode("login");
    };

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();
      submitButton.disabled = true;
      submitButton.textContent = mode === "login" ? "جاري تسجيل الدخول..." : "جاري إنشاء الحساب...";
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      try {
        if (mode === "signup") {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: `${window.location.origin}/login.html` }
          });
          if (error) throw error;
          if (data.session) {
            window.location.replace("/");
            return;
          }
          authSection.style.display = "none";
          verifySection.classList.add("show");
          showMessage("تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط التأكيد.", "success");
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (!data.session) throw new Error("لم يتم إنشاء جلسة تسجيل دخول.");
          window.location.replace("/");
        }
      } catch (error) {
        const raw = error?.message || "حدث خطأ، حاول مرة ثانية.";
        let text = raw;
        if (/invalid login credentials/i.test(raw)) text = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        else if (/email not confirmed/i.test(raw)) text = "لازم تأكد بريدك الإلكتروني أولاً.";
        else if (/user already registered/i.test(raw)) text = "هذا البريد مسجل مسبقاً. جرّب تسجيل الدخول.";
        else if (/password/i.test(raw) && /6/i.test(raw)) text = "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
        showMessage(text, "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = mode === "login" ? "تسجيل الدخول" : "إنشاء الحساب";
      }
    });

    async function start() {
      const { data } = await supabase.auth.getSession();
      if (data.session) window.location.replace("/");
      if (new URLSearchParams(window.location.search).get("verify") === "1") {
        showMessage("تأكد من بريدك الإلكتروني حتى تقدر تدخل للموقع.", "success");
      }
    }
    start();
  </script>
</body>
</html>
