<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>التطور چات - تسجيل الدخول</title>
    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* =========================================
           RESET
        ========================================= */
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(128, 85, 246, 0.20),
                    transparent 38%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(34, 200, 233, 0.14),
                    transparent 38%
                ),
                #050812;
            color: #ffffff;
            min-height: 100vh;
        }
        /* =========================================
           PAGE
        ========================================= */
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }
        .wrapper {
            width: 100%;
            max-width: 520px;
        }
        /* =========================================
           CARD
        ========================================= */
        .card {
            width: 100%;
            padding: 38px;
            background:
                rgba(14, 20, 39, 0.94);
            border:
                1px solid rgba(130, 145, 190, 0.20);
            border-radius: 30px;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(20px);
        }
        /* =========================================
           LOGO
        ========================================= */
        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #21c7e9
                );
            color: #ffffff;
            font-size: 43px;
            font-weight: 800;
            box-shadow:
                0 15px 40px rgba(45, 180, 235, 0.25);
        }
        /* =========================================
           TITLE
        ========================================= */
        .title {
            text-align: center;
            margin: 0;
            font-size: 36px;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #929ab4;
            font-size: 16px;
            line-height: 1.8;
            margin:
                12px
                0
                28px;
        }
        /* =========================================
           MESSAGE
        ========================================= */
        .message {
            display: none;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }
        .message.show {
            display: block;
        }
        .message.error {
            color: #ffb2bd;
            background:
                rgba(255, 65, 92, 0.08);
            border:
                1px solid rgba(255, 65, 92, 0.25);
        }
        .message.success {
            color: #79e8c0;
            background:
                rgba(57, 220, 163, 0.08);
            border:
                1px solid rgba(57, 220, 163, 0.25);
        }
        /* =========================================
           TABS
        ========================================= */
        .tabs {
            display: flex;
            gap: 5px;
            padding: 5px;
            margin-bottom: 25px;
            background: #070c19;
            border-radius: 17px;
        }
        .tab {
            flex: 1;
            height: 52px;
            border: 0;
            border-radius: 13px;
            background: transparent;
            color: #858ea7;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: #121a31;
            color: #ffffff;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }
        /* =========================================
           FORM
        ========================================= */
        .form {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .form.active {
            display: flex;
        }
        .form label {
            color: #d7dbea;
            font-size: 15px;
            margin-top: 6px;
        }
        .form input {
            width: 100%;
            height: 58px;
            padding:
                0
                17px;
            border:
                1px solid rgba(129, 143, 180, 0.20);
            border-radius: 16px;
            outline: none;
            background: #070c19;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            direction: rtl;
            transition: 0.2s;
        }
        .form input:focus {
            border-color: #45c8ed;
            box-shadow:
                0 0 0 3px
                rgba(69, 200, 237, 0.09);
        }
        .form input::placeholder {
            color: #68728c;
        }
        /* =========================================
           BUTTON
        ========================================= */
        .submit-button {
            width: 100%;
            height: 60px;
            margin-top: 18px;
            border: 0;
            border-radius: 17px;
            background:
                linear-gradient(
                    100deg,
                    #8055f6,
                    #22c8e9
                );
            color: #ffffff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.15s,
                opacity 0.15s;
        }
        .submit-button:active {
            transform: scale(0.98);
        }
        .submit-button:disabled {
            opacity: 0.55;
            cursor: wait;
            transform: none;
        }
        /* =========================================
           TERMS
        ========================================= */
        .terms {
            color: #68728c;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
            margin:
                25px
                0
                0;
        }
        /* =========================================
           BACK
        ========================================= */
        .back {
            display: block;
            width: fit-content;
            margin:
                18px
                auto
                0;
            color: #aeb7cf;
            font-size: 14px;
            text-decoration: none;
        }
        .back:hover {
            color: #ffffff;
        }
        /* =========================================
           MOBILE
        ========================================= */
        @media (max-width: 600px) {
            .page {
                padding: 15px;
            }
            .card {
                padding:
                    28px
                    20px;
                border-radius: 24px;
            }
            .logo {
                width: 68px;
                height: 68px;
                border-radius: 20px;
                font-size: 37px;
            }
            .title {
                font-size: 30px;
            }
            .subtitle {
                font-size: 14px;
                margin-bottom: 23px;
            }
            .form input {
                height: 56px;
            }
            .submit-button {
                height: 58px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="wrapper">
        <div class="card">
            <!-- LOGO -->
            <div class="logo">
                ت
            </div>
            <!-- TITLE -->
            <h1 class="title">
                التطور چات
            </h1>
            <p class="subtitle">
                سجّل دخولك وابدأ محادثتك مع المساعد الذكي.
            </p>
            <!-- MESSAGE -->
            <div
                id="message"
                class="message"
            ></div>
            <!-- TABS -->
            <div class="tabs">
                <button
                    id="loginTab"
                    class="tab active"
                    type="button"
                >
                    تسجيل الدخول
                </button>
                <button
                    id="registerTab"
                    class="tab"
                    type="button"
                >
                    إنشاء حساب
                </button>
            </div>
            <!-- =====================================
                 LOGIN FORM
            ====================================== -->
            <form
                id="loginForm"
                class="form active"
            >
                <label for="loginEmail">
                    البريد الإلكتروني
                </label>
                <input
                    id="loginEmail"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
                <label for="loginPassword">
                    كلمة المرور
                </label>
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
                <button
                    id="loginButton"
                    class="submit-button"
                    type="submit"
                >
                    تسجيل الدخول
                </button>
            </form>
            <!-- =====================================
                 REGISTER FORM
            ====================================== -->
            <form
                id="registerForm"
                class="form"
            >
                <label for="registerUsername">
                    اسم المستخدم
                </label>
                <input
                    id="registerUsername"
                    type="text"
                    placeholder="اكتب اسم المستخدم"
                    autocomplete="username"
                    minlength="2"
                    maxlength="30"
                    required
                >
                <label for="registerEmail">
                    البريد الإلكتروني
                </label>
                <input
                    id="registerEmail"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
                <label for="registerPassword">
                    كلمة المرور
                </label>
                <input
                    id="registerPassword"
                    type="password"
                    placeholder="8 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <label for="registerConfirmPassword">
                    تأكيد كلمة المرور
                </label>
                <input
                    id="registerConfirmPassword"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <button
                    id="registerButton"
                    class="submit-button"
                    type="submit"
                >
                    إنشاء الحساب
                </button>
            </form>
            <!-- TERMS -->
            <p class="terms">
                باستخدامك التطور چات، أنت توافق على استخدام الخدمة وفق إعدادات المنصة.
            </p>
            <!-- BACK -->
            <a
                href="/"
                class="back"
            >
                العودة إلى التطور چات
            </a>
        </div>
    </div>
</div>
<script>
    /* =========================================
       SUPABASE CONFIG
    ========================================= */
    const SUPABASE_URL =
        "https://wxsricscchalzvazdbzd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_5oPDD77Veu5OczxaZje7vg_orfNjB5t";
    /* =========================================
       SUPABASE CLIENT
    ========================================= */
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );
    /* =========================================
       ELEMENTS
    ========================================= */
    const loginTab =
        document.getElementById("loginTab");
    const registerTab =
        document.getElementById("registerTab");
    const loginForm =
        document.getElementById("loginForm");
    const registerForm =
        document.getElementById("registerForm");
    const message =
        document.getElementById("message");
    const loginButton =
        document.getElementById("loginButton");
    const registerButton =
        document.getElementById("registerButton");
    /* =========================================
       MESSAGE
    ========================================= */
    function showMessage(
        text,
        type = "error"
    ) {
        message.textContent = text;
        message.className =
            "message show " + type;
    }
    function hideMessage() {
        message.textContent = "";
        message.className =
            "message";
    }
    /* =========================================
       SWITCH TO LOGIN
    ========================================= */
    loginTab.addEventListener(
        "click",
        function () {
            loginTab.classList.add("active");
            registerTab.classList.remove("active");
            loginForm.classList.add("active");
            registerForm.classList.remove("active");
            hideMessage();
        }
    );
    /* =========================================
       SWITCH TO REGISTER
    ========================================= */
    registerTab.addEventListener(
        "click",
        function () {
            registerTab.classList.add("active");
            loginTab.classList.remove("active");
            registerForm.classList.add("active");
            loginForm.classList.remove("active");
            hideMessage();
        }
    );
    /* =========================================
       LOGIN
    ========================================= */
    loginForm.addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();
            hideMessage();
            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();
            const password =
                document
                    .getElementById("loginPassword")
                    .value;
            if (!email || !password) {
                showMessage(
                    "أدخل البريد الإلكتروني وكلمة المرور.",
                    "error"
                );
                return;
            }
            loginButton.disabled = true;
            loginButton.textContent =
                "جاري تسجيل الدخول...";
            try {
                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                if (error) {
                    throw error;
                }
                if (!data || !data.session) {
                    throw new Error(
                        "لم يتم إنشاء جلسة تسجيل الدخول."
                    );
                }
                /*
                 * تسجيل الدخول نجح
                 * ننتقل للصفحة الرئيسية
                 */
                window.location.href = "/";
            } catch (error) {
                console.error(
                    "LOGIN ERROR:",
                    error
                );
                let errorText =
                    "حدث خطأ أثناء تسجيل الدخول.";
                const errorMessage =
                    String(
                        error?.message || ""
                    ).toLowerCase();
                if (
                    errorMessage.includes(
                        "invalid login credentials"
                    )
                ) {
                    errorText =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                }
                else if (
                    errorMessage.includes(
                        "email not confirmed"
                    )
                ) {
                    errorText =
                        "يجب تأكيد البريد الإلكتروني أولاً. تحقق من بريدك.";
                }
                else if (error?.message) {
                    errorText =
                        error.message;
                }
                showMessage(
                    errorText,
                    "error"
                );
            } finally {
                loginButton.disabled = false;
                loginButton.textContent =
                    "تسجيل الدخول";
            }
        }
    );
    /* =========================================
       REGISTER
    ========================================= */
    registerForm.addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();
            hideMessage();
            const username =
                document
                    .getElementById("registerUsername")
                    .value
                    .trim();
            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim()
                    .toLowerCase();
            const password =
                document
                    .getElementById("registerPassword")
                    .value;
            const confirmPassword =
                document
                    .getElementById("registerConfirmPassword")
                    .value;
            /* ================================
               VALIDATION
            ================================= */
            if (username.length < 2) {
                showMessage(
                    "اسم المستخدم يجب أن يحتوي على حرفين على الأقل.",
                    "error"
                );
                return;
            }
            if (password.length < 8) {
                showMessage(
                    "كلمة المرور يجب أن تحتوي على 8 أحرف على الأقل.",
                    "error"
                );
                return;
            }
            if (password !== confirmPassword) {
                showMessage(
                    "كلمتا المرور غير متطابقتين.",
                    "error"
                );
                return;
            }
            registerButton.disabled = true;
            registerButton.textContent =
                "جاري إنشاء الحساب...";
            try {
                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                username: username
                            },
                            emailRedirectTo:
                                window.location.origin +
                                "/login.html"
                        }
                    });
                if (error) {
                    throw error;
                }
                /*
                 * Supabase قد يرجع user بدون identities
                 * إذا كان الحساب موجوداً مسبقاً.
                 */
                if (
                    data?.user &&
                    Array.isArray(data.user.identities) &&
                    data.user.identities.length === 0
                ) {
                    throw new Error(
                        "هذا البريد الإلكتروني مستخدم مسبقاً."
                    );
                }
                /*
                 * إذا كانت الجلسة موجودة مباشرة
                 * فهذا يعني أن تأكيد البريد غير مطلوب.
                 */
                if (data?.session) {
                    showMessage(
                        "تم إنشاء الحساب بنجاح. سيتم تحويلك الآن...",
                        "success"
                    );
                    setTimeout(
                        function () {
                            window.location.href = "/";
                        },
                        800
                    );
                    return;
                }
                /*
                 * إذا لم توجد جلسة،
                 * غالباً البريد يحتاج تأكيد.
                 */
                showMessage(
                    "تم إنشاء حسابك بنجاح. تحقق من بريدك الإلكتروني واضغط رابط التأكيد، وبعدها سجّل الدخول.",
                    "success"
                );
                registerForm.reset();
                setTimeout(
                    function () {
                        loginTab.click();
                    },
                    2500
                );
            } catch (error) {
                console.error(
                    "REGISTER ERROR:",
                    error
                );
                let errorText =
                    "تعذر إنشاء الحساب.";
                const errorMessage =
                    String(
                        error?.message || ""
                    ).toLowerCase();
                if (
                    errorMessage.includes(
                        "user already registered"
                    ) ||
                    errorMessage.includes(
                        "already registered"
                    )
                ) {
                    errorText =
                        "هذا البريد الإلكتروني مستخدم مسبقاً.";
                }
                else if (
                    error?.message
                ) {
                    errorText =
                        error.message;
                }
                showMessage(
                    errorText,
                    "error"
                );
            } finally {
                registerButton.disabled = false;
                registerButton.textContent =
                    "إنشاء الحساب";
            }
        }
    );
    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */
    async function checkSession() {
        try {
            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();
            if (error) {
                console.error(
                    "SESSION ERROR:",
                    error
                );
                return;
            }
            /*
             * إذا المستخدم مسجل دخول مسبقاً
             * لا داعي لعرض صفحة تسجيل الدخول.
             */
            if (data?.session) {
                window.location.href = "/";
            }
        } catch (error) {
            console.error(
                "SESSION CHECK ERROR:",
                error
            );
        }
    }
    /* =========================================
       START
    ========================================= */
    checkSession();
</script>
</body>
</html>
