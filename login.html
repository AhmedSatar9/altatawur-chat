<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>التطور چات - تسجيل الدخول</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 77, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(32, 211, 238, 0.12),
                    transparent 35%
                ),
                #050812;

            color: #ffffff;
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .auth-card {
            width: 100%;
            padding: 36px;

            border-radius: 30px;

            background:
                rgba(14, 20, 39, 0.94);

            border:
                1px solid
                rgba(128, 145, 190, 0.20);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.40);

            text-align: center;
        }

        .logo-box {
            width: 76px;
            height: 76px;

            margin:
                0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    #8055f6,
                    #21c7e9
                );

            color: #ffffff;

            font-size: 42px;
            font-weight: 800;

            box-shadow:
                0 15px 35px
                rgba(45, 180, 235, 0.22);
        }

        .auth-card h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.3;
        }

        .auth-subtitle {
            margin:
                10px 0 28px;

            color: #929ab4;
            font-size: 16px;
            line-height: 1.7;
        }

        .message {
            display: none;

            padding:
                14px 16px;

            margin-bottom: 20px;

            border-radius: 17px;

            font-size: 15px;
            line-height: 1.7;

            text-align: right;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ffb2bd;

            background:
                rgba(255, 65, 92, 0.08);

            border:
                1px solid
                rgba(255, 65, 92, 0.30);
        }

        .message.success {
            color: #79e8c0;

            background:
                rgba(57, 220, 163, 0.08);

            border:
                1px solid
                rgba(57, 220, 163, 0.30);
        }

        .auth-tabs {
            display: flex;
            gap: 5px;

            padding: 5px;
            margin-bottom: 25px;

            border-radius: 18px;

            background: #070c19;
        }

        .auth-tab {
            flex: 1;

            height: 52px;

            border: 0;
            border-radius: 14px;

            background: transparent;

            color: #8f97ae;

            font-size: 16px;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .auth-tab.active {
            background: #121a31;
            color: #ffffff;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.15);
        }

        .auth-form {
            display: none;

            flex-direction: column;

            text-align: right;

            gap: 9px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form label {
            margin-top: 7px;

            color: #d7dbea;

            font-size: 15px;
        }

        .auth-form input {
            width: 100%;
            height: 58px;

            padding:
                0 17px;

            border-radius: 17px;

            border:
                1px solid
                rgba(129, 143, 180, 0.20);

            outline: none;

            background: #070c19;

            color: #ffffff;

            font-size: 16px;

            direction: rtl;

            transition:
                0.2s ease;
        }

        .auth-form input::placeholder {
            color: #59627a;
        }

        .auth-form input:focus {
            border-color: #45c8ed;

            box-shadow:
                0 0 0 3px
                rgba(69, 200, 237, 0.10);
        }

        .primary-button {
            width: 100%;
            height: 60px;

            margin-top: 17px;

            border: 0;
            border-radius: 18px;

            color: #ffffff;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    100deg,
                    #8055f6,
                    #22c8e9
                );

            box-shadow:
                0 10px 30px
                rgba(72, 164, 230, 0.16);

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .primary-button:active {
            transform: scale(0.98);
        }

        .primary-button:disabled {
            opacity: 0.60;
            cursor: wait;
        }

        .terms {
            margin:
                25px 0 0;

            color: #727c97;

            font-size: 13px;

            line-height: 1.8;
        }

        .back-link {
            display: inline-block;

            margin-top: 18px;

            color: #aeb7cf;

            font-size: 14px;

            text-decoration: none;
        }

        .back-link:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {

            .auth-page {
                padding: 14px;
            }

            .auth-card {
                padding:
                    28px 18px;

                border-radius: 24px;
            }

            .logo-box {
                width: 68px;
                height: 68px;

                border-radius: 20px;

                font-size: 37px;
            }

            .auth-card h1 {
                font-size: 29px;
            }

            .auth-subtitle {
                font-size: 14px;
                margin-bottom: 22px;
            }

            .auth-form input {
                height: 56px;
            }

            .primary-button {
                height: 58px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="logo-box">
                ت
            </div>

            <h1>
                التطور چات
            </h1>

            <p class="auth-subtitle">
                سجّل دخولك حتى تبدأ محادثاتك
                مع المساعد الذكي.
            </p>

            <div
                id="message"
                class="message"
            ></div>

            <div class="auth-tabs">

                <button
                    id="loginTab"
                    class="auth-tab active"
                    type="button"
                >
                    تسجيل الدخول
                </button>

                <button
                    id="registerTab"
                    class="auth-tab"
                    type="button"
                >
                    إنشاء حساب
                </button>

            </div>

            <form
                id="loginForm"
                class="auth-form active"
                novalidate
            >

                <label for="loginEmail">
                    البريد الإلكتروني
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">
                    كلمة المرور
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="loginButton"
                    class="primary-button"
                    type="submit"
                >
                    تسجيل الدخول
                </button>

            </form>

            <form
                id="registerForm"
                class="auth-form"
                novalidate
            >

                <label for="registerUsername">
                    اسم المستخدم
                </label>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="اكتب اسم المستخدم"
                    autocomplete="username"
                    minlength="2"
                    maxlength="30"
                    required
                >

                <label for="registerEmail">
                    البريد الإلكتروني
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="8 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="registerConfirmPassword">
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerConfirmPassword"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    id="registerButton"
                    class="primary-button"
                    type="submit"
                >
                    إنشاء الحساب
                </button>

            </form>

            <p class="terms">
                باستخدامك التطور چات، أنت توافق
                على استخدام الخدمة وفق إعدادات المنصة.
            </p>

            <a
                href="/"
                class="back-link"
            >
                العودة إلى التطور چات
            </a>

        </div>
    </div>
</div>

<script src="/login.js?v=4"></script>

</body>
</html>
