<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>التطور چات - تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="auth-page">


<div class="auth-wrapper">


    <div class="auth-card">


        <div class="logo-box">
            ت
        </div>


        <h1>
            التطور چات
        </h1>


        <p class="auth-subtitle">
            سجّل دخولك حتى تبدأ محادثاتك مع المساعد الذكي.
        </p>


        <div
            id="message"
            class="message hidden"
        ></div>


        <div class="auth-tabs">


            <button
                id="loginTab"
                class="auth-tab active"
                type="button"
            >
                تسجيل الدخول
            </button>


            <button
                id="registerTab"
                class="auth-tab"
                type="button"
            >
                إنشاء حساب
            </button>


        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form"
        >


            <label for="loginEmail">
                البريد الإلكتروني
            </label>


            <input
                id="loginEmail"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >


            <label for="loginPassword">
                كلمة المرور
            </label>


            <input
                id="loginPassword"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
            >


            <button
                id="loginButton"
                class="primary-button"
                type="submit"
            >
                تسجيل الدخول
            </button>


        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            class="auth-form hidden"
        >


            <label for="registerUsername">
                اسم المستخدم
            </label>


            <input
                id="registerUsername"
                type="text"
                placeholder="اكتب اسم المستخدم"
                autocomplete="username"
                minlength="2"
                maxlength="30"
                required
            >


            <label for="registerEmail">
                البريد الإلكتروني
            </label>


            <input
                id="registerEmail"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >


            <label for="registerPassword">
                كلمة المرور
            </label>


            <input
                id="registerPassword"
                type="password"
                placeholder="8 أحرف على الأقل"
                autocomplete="new-password"
                minlength="8"
                required
            >


            <label for="registerConfirmPassword">
                تأكيد كلمة المرور
            </label>


            <input
                id="registerConfirmPassword"
                type="password"
                placeholder="أعد كتابة كلمة المرور"
                autocomplete="new-password"
                minlength="8"
                required
            >


            <button
                id="registerButton"
                class="primary-button"
                type="submit"
            >
                إنشاء الحساب
            </button>


        </form>


        <p class="terms">
            باستخدامك التطور چات، أنت توافق على استخدام الخدمة وفق إعدادات المنصة.
        </p>


        <a
            href="/"
            class="back-link"
        >
            العودة إلى التطور چات
        </a>


    </div>


</div>


<script src="login.js"></script>

</body>

</html>
